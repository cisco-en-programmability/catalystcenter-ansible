---
- debug: msg="Starting fabric devices info workflow manager test"
- debug: msg="Role Path {{ role_path }}"

- block:
  - name:  Load vars and declare catalystcenter vars
    include_vars:
      file: "{{ role_path }}/vars/vars_fabric_devices_info_workflow_manager.yml"
      name: vars_map
    vars:
      catalystcenter_login: &catalystcenter_login
        catalystcenter_host: "{{ catalystcenter_host }}"
        catalystcenter_username: "{{ catalystcenter_username }}"
        catalystcenter_password: "{{ catalystcenter_password }}"
        catalystcenter_verify: "{{ catalystcenter_verify }}"
        catalystcenter_port: "{{ catalystcenter_port }}"
        catalystcenter_version: "{{ catalystcenter_version }}"
        catalystcenter_debug: "{{ catalystcenter_debug }}"
        catalystcenter_log: true
        catalystcenter_log_level: DEBUG

####################################################
#                FABRIC DEVICE INFO                #
####################################################

  - name: Fabric Devices Info
    cisco.catalystcenter.fabric_devices_info_workflow_manager:
      <<: *catalystcenter_login
      state: gathered
      config:
          - "{{ item }}"
    loop: "{{ vars_map.fabric_devices_info }}"
    register: result_fabric_devices_info

  - name: Assert Create Application
    assert:
      that:
        - item.changed == false
        - "'The fabric devices filtered' in item.response[0]"
    loop: "{{ result_fabric_devices_info.results }}"
    when: result_fabric_devices_info is defined
