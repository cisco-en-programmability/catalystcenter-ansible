catalystcenter_version: 2.3.7.6
discovery_details:
  cdp:
    - ip_address_list:
      - 204.101.16.1
      devices_list: []
      discovery_type: CDP
      protocol_order: ssh
      discovery_name: CDP Based Discovery1
      discovery_specific_credentials:
        net_conf_port: "830"
      retry: 2
  single:
    - ip_address_list:
      - 204.101.16.1
      devices_list: []
      discovery_type: SINGLE
      protocol_order: ssh
      discovery_name: Single IP Discovery11
      discovery_specific_credentials:
        cli_credentials_list:
            - username: wlcaccess
              password: "{{ discovery_cli_password }}"
              enable_password: "{{ discovery_cli_enable_password }}"
            - username: cisco
              password: "{{ discovery_cli_password }}"
              enable_password: "{{ discovery_cli_enable_password }}"
        http_read_credential:
            username: wlcaccess
            password: "{{ discovery_http_read_password }}"
            port: 443
            secure: true
        http_write_credential:
            username: wlcaccess
            password: "{{ discovery_http_write_password }}"
            port: 443
            secure: true
        snmp_v2_read_credential:
            description: snmpV2 Sample 1
            community: "{{ discovery_snmp_v2_read_community }}"
        snmp_v2_write_credential:
            description: snmpV2 Sample 1
            community: "{{ discovery_snmp_v2_write_community }}"
        net_conf_port: "830"
      retry: 2
    - ip_address_list:
      - 204.101.16.2
      devices_list: []
      discovery_type: SINGLE
      protocol_order: ssh
      discovery_name: Single IP Discovery11
      discovery_specific_credentials:
        cli_credentials_list:
            - username: wlcaccess
              password: "{{ discovery_cli_password }}"
              enable_password: "{{ discovery_cli_enable_password }}"
            - username: cisco
              password: "{{ discovery_cli_password }}"
              enable_password: "{{ discovery_cli_enable_password }}"
        http_read_credential:
            username: wlcaccess
            password: "{{ discovery_http_read_password }}"
            port: 443
            secure: true
        http_write_credential:
            username: wlcaccess
            password: "{{ discovery_http_write_password }}"
            port: 443
            secure: true
        snmp_v3_credential:
            description: snmpv3Credentials
            username: wlcaccess
            snmp_mode: AUTHPRIV
            auth_password: "{{ discovery_snmp_v3_auth_password }}"
            auth_type: SHA
            privacy_type: AES128
            privacy_password: "{{ discovery_snmp_v3_privacy_password }}"
        net_conf_port: "830"
      retry: 2
  range:
    - ip_address_list:
      - 204.101.16.2-204.101.16.2
      discovery_type: RANGE
      protocol_order: ssh
      discovery_name: Range IP Discovery11
      discovery_specific_credentials:
        cli_credentials_list:
            - username: wlcaccess
              password: "{{ discovery_cli_password }}"
              enable_password: "{{ discovery_cli_enable_password }}"
            - username: cisco
              password: "{{ discovery_cli_password }}"
              enable_password: "{{ discovery_cli_enable_password }}"
        http_read_credential:
            username: wlcaccess
            password: "{{ discovery_http_read_password }}"
            port: 443
            secure: true
        http_write_credential:
            username: wlcaccess
            password: "{{ discovery_http_write_password }}"
            port: 443
            secure: true
        snmp_v3_credential:
            description: snmpV3 Sample 1
            username: wlcaccess
            snmp_mode: AUTHPRIV
            auth_password: "{{ discovery_snmp_v3_auth_password }}"
            auth_type: SHA
            privacy_type: AES128
            privacy_password: "{{ discovery_snmp_v3_privacy_password }}"
        net_conf_port: "830"
      retry: 2
  multi_range:
    - ip_address_list:
      - 204.101.16.2-204.101.16.3
      - 204.101.16.4-204.101.16.4
      discovery_type: MULTI RANGE
      protocol_order: ssh
      discovery_name: Multi Range Discovery 11
      discovery_specific_credentials:
        cli_credentials_list:
            - username: wlcaccess
              password: "{{ discovery_cli_password }}"
              enable_password: "{{ discovery_cli_enable_password }}"
            - username: cisco
              password: "{{ discovery_cli_password }}"
              enable_password: "{{ discovery_cli_enable_password }}"
        http_read_credential:
            username: wlcaccess
            password: "{{ discovery_http_read_password }}"
            port: 443
            secure: true
        http_write_credential:
            username: wlcaccess
            password: "{{ discovery_http_write_password }}"
            port: 443
            secure: true
        snmp_v3_credential:
            description: snmpV3 Sample 1
            username: wlcaccess
            snmp_mode: AUTHPRIV
            auth_password: "{{ discovery_snmp_v3_auth_password }}"
            auth_type: SHA
            privacy_type: AES128
            privacy_password: "{{ discovery_snmp_v3_privacy_password }}"
        net_conf_port: "830"
      timeout: 30
      retry: 2
