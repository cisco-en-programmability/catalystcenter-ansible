---
#Select Catalyst Cennter version, this one overwrite the default version from host file
catalystcenter_version: 2.3.7.6
# This file contains the variables for the inventory workflow
inventory_details:
  network_devices:
  - ip_address_list: ["204.101.16.1", "1.1.1.1", "2.2.2.2"]
    cli_transport: ssh
    compute_device: False
    password: "{{ inventory_cli_password }}"
    enable_password: "{{ inventory_cli_enable_password }}"
    extended_discovery_info: test
    http_username: "testuser"
    http_password: "{{ inventory_http_password }}"
    http_port: "443"
    http_secure: False
    netconf_port: 830
    snmp_auth_passphrase: "{{ inventory_snmp_auth_passphrase }}"
    snmp_auth_protocol: SHA
    snmp_mode: AUTHPRIV
    snmp_priv_passphrase: "{{ inventory_snmp_priv_passphrase }}"
    snmp_priv_protocol: AES256
    snmp_retry: 3
    snmp_timeout: 5
    snmp_username: v3Public
    snmp_version: v3
    type: NETWORK_DEVICE
    username: cisco