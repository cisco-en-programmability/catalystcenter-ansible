---
- name: Initialize old-device matches for batch mapping
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_mapping_match_ips: >-
      {{
        [switch_refresh_sda_fabric_edge_resolve_mapping.old.management_ip | string]
        if (
          not (switch_refresh_sda_fabric_edge_device_info_lookup_enabled | bool) and
          switch_refresh_sda_fabric_edge_resolve_mapping.old.management_ip is defined
        )
        else []
      }}

- name: Match old inventory records to batch mapping
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_mapping_match_ips: >-
      {{
        switch_refresh_sda_fabric_edge_mapping_match_ips +
        [switch_refresh_sda_fabric_edge_old_info_entry.device_ip | string]
      }}
  loop: "{{ switch_refresh_sda_fabric_edge_batch_old_device_info_entries }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_edge_old_info_entry
    label: "{{ switch_refresh_sda_fabric_edge_old_info_entry.device_ip | default('old-device') }}"
  when:
    - switch_refresh_sda_fabric_edge_device_info_lookup_enabled | bool
    - switch_refresh_sda_fabric_edge_old_info_entry.device_details is defined
    - (switch_refresh_sda_fabric_edge_old_info_entry.device_details | type_debug) == 'list'
    - switch_refresh_sda_fabric_edge_old_info_entry.device_details | length == 1
    - >-
      (
        switch_refresh_sda_fabric_edge_resolve_mapping.old.management_ip is defined and
        switch_refresh_sda_fabric_edge_old_info_entry.device_ip | string ==
        switch_refresh_sda_fabric_edge_resolve_mapping.old.management_ip | string
      ) or (
        switch_refresh_sda_fabric_edge_resolve_mapping.old.hostname is defined and
        switch_refresh_sda_fabric_edge_old_info_entry.device_details[0].hostname |
        default('') |
        lower == switch_refresh_sda_fabric_edge_resolve_mapping.old.hostname | string | lower
      ) or (
        switch_refresh_sda_fabric_edge_resolve_mapping.old.serial_number is defined and
        switch_refresh_sda_fabric_edge_resolve_mapping.old.serial_number | string | upper in
        (
          switch_refresh_sda_fabric_edge_old_info_entry.device_details[0].serialNumber |
          default('') |
          string
        ).split(',') |
        map('trim') |
        map('upper') |
        list
      ) or (
        switch_refresh_sda_fabric_edge_resolve_mapping.old.mac_address is defined and
        switch_refresh_sda_fabric_edge_old_info_entry.device_details[0].macAddress |
        default('') |
        string |
        lower |
        regex_replace('[:-]', '') ==
        switch_refresh_sda_fabric_edge_resolve_mapping.old.mac_address |
        string |
        lower |
        regex_replace('[:-]', '')
      )

- name: Validate exactly one old-device match for batch mapping
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_edge_mapping_match_ips | length == 1
    fail_msg: >-
      Expected exactly one old inventory device for replacement
      {{ switch_refresh_sda_fabric_edge_resolve_mapping.new_device_management_ip }} using
      {{ switch_refresh_sda_fabric_edge_resolve_mapping.old }}, but matched
      {{ switch_refresh_sda_fabric_edge_mapping_match_ips }}.

- name: Add resolved batch device mapping
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_batch_resolved_mappings: >-
      {{
        switch_refresh_sda_fabric_edge_batch_resolved_mappings + [
          switch_refresh_sda_fabric_edge_resolve_mapping |
          combine({'old_management_ip': switch_refresh_sda_fabric_edge_mapping_match_ips | first})
        ]
      }}
