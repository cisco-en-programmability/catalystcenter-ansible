---
# Pure evaluator for a fabric_devices_info result. Callers provide
# switch_refresh_sda_fabric_edge_fabric_validation_request and an explicit raw result.
- name: Validate fabric membership evaluator inputs
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_edge_fabric_validation_request is mapping
      - switch_refresh_sda_fabric_edge_fabric_validation_request.site is defined
      - >-
        (switch_refresh_sda_fabric_edge_fabric_validation_request.site | type_debug) == 'str'
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_request.site |
        string |
        trim |
        length > 0
      - switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips is defined
      - >-
        (switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips | type_debug) ==
        'list'
      - switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips | length > 0
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips |
        map('string') |
        unique |
        length ==
        switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips | length
      - switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state is defined
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string in
        ['present', 'absent']
      - switch_refresh_sda_fabric_edge_fabric_validation_request.context is defined
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_request.context |
        string |
        trim |
        length > 0
      - switch_refresh_sda_fabric_edge_fabric_validation_raw_result is mapping
      - >-
        not (
          switch_refresh_sda_fabric_edge_fabric_validation_raw_result.failed |
          default(false) |
          bool
        )
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_raw_result.status is not defined or
        (
          (
            switch_refresh_sda_fabric_edge_fabric_validation_raw_result.status | type_debug
          ) == 'str' and
          switch_refresh_sda_fabric_edge_fabric_validation_raw_result.status |
          trim |
          lower == 'success'
        )
      - switch_refresh_sda_fabric_edge_fabric_validation_raw_result.response is defined
      - >-
        (switch_refresh_sda_fabric_edge_fabric_validation_raw_result.response | type_debug) ==
        'list'
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_request.response_role |
        default('') |
        string |
        trim |
        length == 0 or
        switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string ==
        'present'
    fail_msg: >-
      Fabric membership response evaluation requires a valid request and a
      structured fabric_devices_info response list.

- name: Initialize normalized fabric membership entries
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_fabric_validation_entries: []
    switch_refresh_sda_fabric_edge_fabric_validation_structured_fragment_count: 0

- name: Validate fabric membership response fragments
  ansible.builtin.assert:
    that:
      - >-
        (
          switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string ==
          'absent' and
          switch_refresh_sda_fabric_edge_fabric_validation_raw_result.response ==
          ['No fabric devices found for the given filters.']
        ) or
        (
          switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string ==
          'present' and
          (
            (
              (switch_refresh_sda_fabric_edge_fabric_response_item | type_debug) == 'str' and
              switch_refresh_sda_fabric_edge_fabric_response_item !=
              'No fabric devices found for the given filters.'
            ) or
            (
              (switch_refresh_sda_fabric_edge_fabric_response_item | type_debug) == 'list' and
              switch_refresh_sda_fabric_edge_fabric_response_item | length == 1 and
              switch_refresh_sda_fabric_edge_fabric_response_item[0] is mapping and
              switch_refresh_sda_fabric_edge_fabric_response_item[0].fabric_info is defined and
              (
                switch_refresh_sda_fabric_edge_fabric_response_item[0].fabric_info | type_debug
              ) == 'list'
            )
          )
        )
    fail_msg: >-
      Fabric membership validation received a malformed or unexpected response
      fragment during {{ switch_refresh_sda_fabric_edge_fabric_validation_request.context }}.
  loop: "{{ switch_refresh_sda_fabric_edge_fabric_validation_raw_result.response }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_edge_fabric_response_item
    label: fabric-membership-response-fragment

- name: Extract normalized fabric membership entries
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_fabric_validation_entries: >-
      {{
        switch_refresh_sda_fabric_edge_fabric_validation_entries +
        switch_refresh_sda_fabric_edge_fabric_response_item[0].fabric_info
      }}
    switch_refresh_sda_fabric_edge_fabric_validation_structured_fragment_count: >-
      {{ switch_refresh_sda_fabric_edge_fabric_validation_structured_fragment_count | int + 1 }}
  loop: "{{ switch_refresh_sda_fabric_edge_fabric_validation_raw_result.response }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_edge_fabric_response_item
    label: fabric-membership-response
  when:
    - (switch_refresh_sda_fabric_edge_fabric_response_item | type_debug) == 'list'
    - switch_refresh_sda_fabric_edge_fabric_response_item | length == 1
    - switch_refresh_sda_fabric_edge_fabric_response_item[0] is mapping
    - switch_refresh_sda_fabric_edge_fabric_response_item[0].fabric_info is defined
    - >-
      (switch_refresh_sda_fabric_edge_fabric_response_item[0].fabric_info | type_debug) ==
      'list'

- name: Require canonical present fabric membership payload
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_structured_fragment_count | int == 1
    fail_msg: >-
      Fabric membership validation requires exactly one structured fabric_info
      payload during {{ switch_refresh_sda_fabric_edge_fabric_validation_request.context }}.
  when: >-
    switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string ==
    'present'

- name: Validate exact fabric membership coverage
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_entries | length ==
        switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips | length
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_entries |
        map(attribute='device_ip') |
        map('string') |
        unique |
        list |
        length == switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips | length
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_entries |
        map(attribute='device_ip') |
        map('string') |
        list |
        sort ==
        switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips |
        map('string') |
        list |
        sort
    fail_msg: >-
      Fabric membership validation did not find exactly
      {{ switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips }} in
      {{ switch_refresh_sda_fabric_edge_fabric_validation_request.site }} during
      {{ switch_refresh_sda_fabric_edge_fabric_validation_request.context }}.
  when: >-
    switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string ==
    'present'

- name: Validate fabric membership record details
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_edge_fabric_validation_entry is mapping
      - switch_refresh_sda_fabric_edge_fabric_validation_entry.device_ip is defined
      - >-
        (switch_refresh_sda_fabric_edge_fabric_validation_entry.device_ip | type_debug) == 'str'
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_entry.device_ip | trim | length > 0
      - switch_refresh_sda_fabric_edge_fabric_validation_entry.fabric_details is defined
      - >-
        (switch_refresh_sda_fabric_edge_fabric_validation_entry.fabric_details | type_debug) ==
        'list'
      - switch_refresh_sda_fabric_edge_fabric_validation_entry.fabric_details | length > 0
    fail_msg: >-
      Fabric membership validation received an invalid record for
      {{ switch_refresh_sda_fabric_edge_fabric_validation_entry.device_ip | default('unknown') }}
      during {{ switch_refresh_sda_fabric_edge_fabric_validation_request.context }}.
  loop: "{{ switch_refresh_sda_fabric_edge_fabric_validation_entries }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_edge_fabric_validation_entry
    label: >-
      {{ switch_refresh_sda_fabric_edge_fabric_validation_entry.device_ip |
      default('fabric-device') }}
  when: >-
    switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string ==
    'present'

- name: Validate required fabric membership response role
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_entry.fabric_details |
        selectattr('deviceRoles', 'defined') |
        list |
        length ==
        switch_refresh_sda_fabric_edge_fabric_validation_entry.fabric_details | length
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_request.response_role |
        string |
        upper in
        (
          switch_refresh_sda_fabric_edge_fabric_validation_entry.fabric_details |
          map(attribute='deviceRoles') |
          list |
          flatten |
          map('upper') |
          list
        )
    fail_msg: >-
      Fabric membership validation received a record without required role
      {{ switch_refresh_sda_fabric_edge_fabric_validation_request.response_role }} for
      {{ switch_refresh_sda_fabric_edge_fabric_validation_entry.device_ip | default('unknown') }}
      during {{ switch_refresh_sda_fabric_edge_fabric_validation_request.context }}.
  loop: "{{ switch_refresh_sda_fabric_edge_fabric_validation_entries }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_edge_fabric_validation_entry
    label: >-
      {{ switch_refresh_sda_fabric_edge_fabric_validation_entry.device_ip |
      default('fabric-device') }}
  when:
    - >-
      switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string ==
      'present'
    - >-
      switch_refresh_sda_fabric_edge_fabric_validation_request.response_role |
      default('') |
      string |
      trim |
      length > 0

- name: Confirm exact fabric membership absence
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_edge_fabric_validation_entries | length == 0
      - >-
        switch_refresh_sda_fabric_edge_fabric_validation_raw_result.response ==
        ['No fabric devices found for the given filters.']
    fail_msg: >-
      One or more requested devices may still be present in fabric
      {{ switch_refresh_sda_fabric_edge_fabric_validation_request.site }} during
      {{ switch_refresh_sda_fabric_edge_fabric_validation_request.context }}:
      {{ switch_refresh_sda_fabric_edge_fabric_validation_entries }}. Absence validation also
      requires the explicit "No fabric devices found for the given filters."
      controller response and rejects unexpected or error responses.
  when: >-
    switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string ==
    'absent'

- name: Record validated fabric membership summary
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_fabric_validation_summary:
      site: "{{ switch_refresh_sda_fabric_edge_fabric_validation_request.site }}"
      expected_ips: >-
        {{
          switch_refresh_sda_fabric_edge_fabric_validation_request.expected_ips |
          map('string') |
          list
        }}
      expected_state: >-
        {{ switch_refresh_sda_fabric_edge_fabric_validation_request.expected_state | string }}
      context: "{{ switch_refresh_sda_fabric_edge_fabric_validation_request.context }}"
      entries: "{{ switch_refresh_sda_fabric_edge_fabric_validation_entries }}"
