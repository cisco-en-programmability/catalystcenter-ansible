---
# Pure hostname update planner. This helper can be exercised without a live
# Catalyst Center by supplying captured entries and inventory record fixtures.
- name: Validate hostname update planner inputs
  ansible.builtin.assert:
    that:
      - (switch_refresh_sda_fabric_edge_hostname_finalize_entries | type_debug) == 'list'
      - switch_refresh_sda_fabric_edge_hostname_finalize_entries | length > 0
      - (switch_refresh_sda_fabric_edge_hostname_new_inventory_records | type_debug) == 'list'
      - (switch_refresh_sda_fabric_edge_hostname_claim_inventory_records | type_debug) == 'list'
      - >-
        (switch_refresh_sda_fabric_edge_hostname_builder_strict | default(true) | type_debug)
        == 'bool'
      - >-
        (
          switch_refresh_sda_fabric_edge_hostname_builder_build_payload |
          default(true) |
          type_debug
        ) == 'bool'
    fail_msg: >-
      Hostname update planning requires non-empty captured entries, replacement
      and hostname-claim inventory record lists, and boolean planner controls.

- name: Initialize hostname update batch planner
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_update_devices: []
    switch_refresh_sda_fabric_edge_hostname_runtime_entries: []
    switch_refresh_sda_fabric_edge_hostname_builder_strict: >-
      {{ switch_refresh_sda_fabric_edge_hostname_builder_strict | default(true) | bool }}
    switch_refresh_sda_fabric_edge_hostname_builder_build_payload: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_builder_build_payload |
        default(true) |
        bool
      }}

- name: Validate common hostname update planner entry schema
  ansible.builtin.include_tasks: validate_hostname_transfer_entries.yml
  vars:
    switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_request:
      entries: "{{ switch_refresh_sda_fabric_edge_hostname_finalize_entries }}"
      context: hostname update planner entries

- name: Use normalized hostname update planner entries
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_finalize_entries: >-
      {{ switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entries }}
  no_log: true

- name: Validate hostname transfer inventory record types
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_edge_hostname_inventory_record is mapping
    fail_msg: Hostname transfer inventory responses must contain mappings only.
  loop: >-
    {{
      switch_refresh_sda_fabric_edge_hostname_new_inventory_records +
      switch_refresh_sda_fabric_edge_hostname_claim_inventory_records
    }}
  loop_control:
    loop_var: switch_refresh_sda_fabric_edge_hostname_inventory_record
    label: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_inventory_record.managementIpAddress |
        default('inventory-record')
        if (switch_refresh_sda_fabric_edge_hostname_inventory_record is mapping)
        else 'invalid-inventory-record'
      }}

- name: Validate hostname update batch uniqueness
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.new_management_ips |
        unique |
        length ==
        switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entry_count
      - >-
        switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.old_hostnames |
        map('lower') |
        unique |
        length ==
        switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entry_count
    fail_msg: >-
      A hostname update batch requires unique replacement management IPs and
      case-insensitively unique captured hostnames.

- name: Classify captured hostname transfer entries
  ansible.builtin.include_tasks: classify_hostname_transfer_entry.yml
  loop: "{{ switch_refresh_sda_fabric_edge_hostname_finalize_entries }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_edge_hostname_finalize_entry
    label: "{{ switch_refresh_sda_fabric_edge_hostname_finalize_entry.new_management_ip }}"

- name: Validate hostname update planner coverage
  ansible.builtin.assert:
    that:
      - >-
        switch_refresh_sda_fabric_edge_hostname_runtime_entries | length ==
        switch_refresh_sda_fabric_edge_hostname_finalize_entries | length
      - >-
        switch_refresh_sda_fabric_edge_hostname_update_devices |
        map(attribute='device_management_ip_address') |
        map('string') |
        unique |
        length == switch_refresh_sda_fabric_edge_hostname_update_devices | length
      - >-
        switch_refresh_sda_fabric_edge_hostname_update_devices |
        map(attribute='new_host_name') |
        map('string') |
        map('lower') |
        unique |
        length == switch_refresh_sda_fabric_edge_hostname_update_devices | length
    fail_msg: >-
      Hostname update planning did not produce exact captured-entry coverage or
      produced duplicate update targets or case-insensitive LAN Automation
      hostname labels.
