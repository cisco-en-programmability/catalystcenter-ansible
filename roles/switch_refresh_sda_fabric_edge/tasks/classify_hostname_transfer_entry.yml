---
# Pure per-device hostname-transfer classification. The caller supplies the
# captured manifest entry and the two inventory record lists. No controller
# operation is performed in this helper.
- name: Initialize hostname transfer entry matches
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_entry_new_matches: []
    switch_refresh_sda_fabric_edge_hostname_entry_claim_matches: []

- name: Match replacement inventory record by management IP
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_entry_new_matches: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_new_matches +
        [switch_refresh_sda_fabric_edge_hostname_inventory_record]
      }}
  loop: "{{ switch_refresh_sda_fabric_edge_hostname_new_inventory_records }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_edge_hostname_inventory_record
    label: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_inventory_record.managementIpAddress |
        default('inventory-record')
      }}
  when:
    - switch_refresh_sda_fabric_edge_hostname_inventory_record is mapping
    - >-
      switch_refresh_sda_fabric_edge_hostname_inventory_record.managementIpAddress |
      default('') |
      string ==
      switch_refresh_sda_fabric_edge_hostname_finalize_entry.new_management_ip | string

- name: Match inventory records claiming the desired hostname
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_entry_claim_matches: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_claim_matches +
        [switch_refresh_sda_fabric_edge_hostname_inventory_record]
      }}
  loop: "{{ switch_refresh_sda_fabric_edge_hostname_claim_inventory_records }}"
  loop_control:
    loop_var: switch_refresh_sda_fabric_edge_hostname_inventory_record
    label: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_inventory_record.hostname |
        default('inventory-record')
      }}
  when:
    - switch_refresh_sda_fabric_edge_hostname_inventory_record is mapping
    - >-
      switch_refresh_sda_fabric_edge_hostname_inventory_record.hostname |
      default('') |
      string |
      lower == switch_refresh_sda_fabric_edge_hostname_finalize_entry.old_hostname |
      string |
      lower

- name: Select replacement hostname transfer record
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_entry_new_record: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_new_matches[0]
        if (switch_refresh_sda_fabric_edge_hostname_entry_new_matches | length == 1)
        else {}
      }}

- name: Normalize captured and observed replacement identities
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_entry_expected_serials: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_finalize_entry.new_serial_number |
        string |
        split(',') |
        map('trim') |
        map('upper') |
        reject('equalto', '') |
        unique |
        sort |
        list
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_observed_serials: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_new_record.serialNumber |
        default('') |
        string |
        split(',') |
        map('trim') |
        map('upper') |
        reject('equalto', '') |
        unique |
        sort |
        list
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_observed_uuid: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_new_record.instanceUuid |
        default(
          switch_refresh_sda_fabric_edge_hostname_entry_new_record.id | default(''),
          true
        ) |
        string
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_observed_hostname: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_new_record.hostname |
        default('') |
        string
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_submission_hostname: >-
      {{
        (
          switch_refresh_sda_fabric_edge_hostname_finalize_entry.old_hostname |
          string |
          trim
        ).split('.')[0] |
        trim
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_observed_management_state: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_new_record.managementState |
        default(
          switch_refresh_sda_fabric_edge_hostname_entry_new_record.collectionStatus |
          default(''),
          true
        ) |
        string
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_observed_reachability_status: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_new_record.reachabilityStatus |
        default('') |
        string
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_observed_inventory_role: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_new_record.role |
        default('') |
        string
      }}

- name: Derive hostname transfer entry safety state
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_entry_ip_is_unique: >-
      {{ switch_refresh_sda_fabric_edge_hostname_entry_new_matches | length == 1 }}
    switch_refresh_sda_fabric_edge_hostname_entry_uuid_matches: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_observed_uuid | lower ==
        switch_refresh_sda_fabric_edge_hostname_finalize_entry.new_device_uuid |
        string |
        lower
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_serial_matches: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_observed_serials ==
        switch_refresh_sda_fabric_edge_hostname_entry_expected_serials
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_is_managed: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_observed_management_state | lower ==
        'managed'
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_is_reachable: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_observed_reachability_status | upper in
        ['REACHABLE', 'PING REACHABLE']
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_is_access: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_observed_inventory_role | upper ==
        'ACCESS'
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_name_is_available: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_claim_matches | length == 0 or
        (
          switch_refresh_sda_fabric_edge_hostname_entry_claim_matches | length == 1 and
          (
            switch_refresh_sda_fabric_edge_hostname_entry_claim_matches[0].instanceUuid |
            default(
              switch_refresh_sda_fabric_edge_hostname_entry_claim_matches[0].id |
              default(''),
              true
            ) |
            string |
            lower
          ) ==
          (switch_refresh_sda_fabric_edge_hostname_finalize_entry.new_device_uuid |
          string | lower)
        )
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_name_matches: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_observed_hostname | lower ==
        switch_refresh_sda_fabric_edge_hostname_finalize_entry.old_hostname |
        string |
        lower
      }}

- name: Derive hostname transfer entry eligibility
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_entry_is_eligible: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_entry_ip_is_unique | bool and
        switch_refresh_sda_fabric_edge_hostname_entry_uuid_matches | bool and
        switch_refresh_sda_fabric_edge_hostname_entry_serial_matches | bool and
        switch_refresh_sda_fabric_edge_hostname_entry_is_managed | bool and
        switch_refresh_sda_fabric_edge_hostname_entry_is_reachable | bool and
        switch_refresh_sda_fabric_edge_hostname_entry_is_access | bool and
        switch_refresh_sda_fabric_edge_hostname_entry_name_is_available | bool
      }}

- name: Enforce replacement hostname transfer safety
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_edge_hostname_entry_ip_is_unique | bool
      - switch_refresh_sda_fabric_edge_hostname_entry_uuid_matches | bool
      - switch_refresh_sda_fabric_edge_hostname_entry_serial_matches | bool
      - switch_refresh_sda_fabric_edge_hostname_entry_is_managed | bool
      - switch_refresh_sda_fabric_edge_hostname_entry_is_reachable | bool
      - switch_refresh_sda_fabric_edge_hostname_entry_is_access | bool
      - switch_refresh_sda_fabric_edge_hostname_entry_name_is_available | bool
    fail_msg: >-
      Replacement {{ switch_refresh_sda_fabric_edge_hostname_finalize_entry.new_management_ip }}
      is missing, duplicated, no longer matches its captured UUID/serial,
      is not Managed, Reachable, and ACCESS, or the desired hostname
      {{ switch_refresh_sda_fabric_edge_hostname_finalize_entry.old_hostname }} is owned by a
      different inventory device. No hostname update was submitted.
  when: switch_refresh_sda_fabric_edge_hostname_builder_strict | bool

- name: Derive hostname transfer entry outcome
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_entry_status: >-
      {{
        'verified'
        if (
          switch_refresh_sda_fabric_edge_hostname_entry_is_eligible | bool and
          switch_refresh_sda_fabric_edge_hostname_entry_name_matches | bool
        )
        else 'rename_pending'
      }}
    switch_refresh_sda_fabric_edge_hostname_entry_failure_reason: >-
      {{
        ''
        if (
          switch_refresh_sda_fabric_edge_hostname_entry_is_eligible | bool and
          switch_refresh_sda_fabric_edge_hostname_entry_name_matches | bool
        )
        else 'replacement_not_found_or_not_unique'
        if not (switch_refresh_sda_fabric_edge_hostname_entry_ip_is_unique | bool)
        else 'replacement_uuid_changed'
        if not (switch_refresh_sda_fabric_edge_hostname_entry_uuid_matches | bool)
        else 'replacement_serial_changed'
        if not (switch_refresh_sda_fabric_edge_hostname_entry_serial_matches | bool)
        else 'replacement_not_managed'
        if not (switch_refresh_sda_fabric_edge_hostname_entry_is_managed | bool)
        else 'replacement_not_reachable'
        if not (switch_refresh_sda_fabric_edge_hostname_entry_is_reachable | bool)
        else 'replacement_not_access'
        if not (switch_refresh_sda_fabric_edge_hostname_entry_is_access | bool)
        else 'hostname_owned_by_different_device'
        if not (switch_refresh_sda_fabric_edge_hostname_entry_name_is_available | bool)
        else 'hostname_not_converged'
      }}

- name: Validate pending LAN Automation hostname label
  ansible.builtin.assert:
    that:
      - switch_refresh_sda_fabric_edge_hostname_entry_submission_hostname | length > 0
      - switch_refresh_sda_fabric_edge_hostname_entry_submission_hostname | length <= 63
    fail_msg: >-
      The captured desired hostname
      {{ switch_refresh_sda_fabric_edge_hostname_finalize_entry.old_hostname }} does not produce
      a valid non-empty LAN Automation hostname label of at most 63 characters.
      No hostname update was submitted.
  when:
    - switch_refresh_sda_fabric_edge_hostname_builder_build_payload | bool
    - switch_refresh_sda_fabric_edge_hostname_entry_is_eligible | bool
    - not (switch_refresh_sda_fabric_edge_hostname_entry_name_matches | bool)

- name: Add pending hostname update payload entry
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_update_devices: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_update_devices + [
          {
            'device_management_ip_address':
              switch_refresh_sda_fabric_edge_hostname_finalize_entry.new_management_ip,
            'new_host_name':
              switch_refresh_sda_fabric_edge_hostname_entry_submission_hostname
          }
        ]
      }}
  when:
    - switch_refresh_sda_fabric_edge_hostname_builder_build_payload | bool
    - switch_refresh_sda_fabric_edge_hostname_entry_is_eligible | bool
    - not (switch_refresh_sda_fabric_edge_hostname_entry_name_matches | bool)

- name: Record hostname transfer entry state
  ansible.builtin.set_fact:
    switch_refresh_sda_fabric_edge_hostname_runtime_entries: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_runtime_entries + [
          switch_refresh_sda_fabric_edge_hostname_finalize_entry |
          combine(
            {
              'desired_hostname':
                switch_refresh_sda_fabric_edge_hostname_finalize_entry.old_hostname,
              'observed_new_hostname':
                switch_refresh_sda_fabric_edge_hostname_entry_observed_hostname,
              'status': switch_refresh_sda_fabric_edge_hostname_entry_status,
              'failure_reason':
                switch_refresh_sda_fabric_edge_hostname_entry_failure_reason
            }
          )
        ]
      }}
