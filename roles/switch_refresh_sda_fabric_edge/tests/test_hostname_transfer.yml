---
- name: Validate switch refresh hostname transfer planning offline
  hosts: plan_test
  gather_facts: false
  vars:
    catalystcenter_host: test-controller.example.test
    switch_refresh_sda_fabric_edge_hostname_test_dir: >-
      /tmp/catalystcenter_switch_refresh_sda_fabric_edge-hostname-transfer-test
    switch_refresh_sda_fabric_edge_hostname_test_manifest: >-
      {{
        switch_refresh_sda_fabric_edge_hostname_test_dir ~
        '/discovery-hostname-transfer_hostname_transfer.yml'
      }}
    switch_refresh_sda_fabric_edge_cleanup_inventory_enabled: true
    switch_refresh_sda_fabric_edge_hostname_transfer_timeout: 300
    switch_refresh_sda_fabric_edge_hostname_transfer_poll_interval: 5
    switch_refresh_sda_fabric_edge_hostname_validation_retries: 3
    switch_refresh_sda_fabric_edge_hostname_validation_interval: 1
    switch_refresh_sda_fabric_edge_hostname_test_mappings:
      - old_management_ip: "198.51.100.20"
        new_device_management_ip: "192.0.2.20"
      - old_management_ip: "198.51.100.21"
        new_device_management_ip: "192.0.2.21"
    switch_refresh_sda_fabric_edge_hostname_test_inventory:
      - device_ip: "198.51.100.20"
        device_details:
          - managementIpAddress: "198.51.100.20"
            hostname: OLD-EDGE-01.example.test
            instanceUuid: old-uuid-01
            serialNumber: OLD-SERIAL-01
      - device_ip: "192.0.2.20"
        device_details:
          - managementIpAddress: "192.0.2.20"
            hostname: temporary-edge-01
            instanceUuid: new-uuid-01
            serialNumber: NEW-SERIAL-01
            managementState: Managed
            reachabilityStatus: Reachable
            role: ACCESS
      - device_ip: "198.51.100.21"
        device_details:
          - managementIpAddress: "198.51.100.21"
            hostname: old-edge-02.example.test
            instanceUuid: old-uuid-02
            serialNumber: OLD-SERIAL-02
      - device_ip: "192.0.2.21"
        device_details:
          - managementIpAddress: "192.0.2.21"
            hostname: temporary-edge-02
            instanceUuid: new-uuid-02
            serialNumber: NEW-SERIAL-02
            managementState: Managed
            reachabilityStatus: Reachable
            role: ACCESS
    switch_refresh_sda_fabric_edge_hostname_test_control_batches:
      - name: hostname-control-test
        fabric_site_name_hierarchy: Global/Test/Fabric
        new_devices:
          device_ips:
            - "192.0.2.20"
        device_mapping:
          - old:
              management_ip: "198.51.100.20"
            new:
              management_ip: "192.0.2.20"

  tasks:
    - name: Remove stale hostname transfer test directory
      ansible.builtin.file:
        path: "{{ switch_refresh_sda_fabric_edge_hostname_test_dir }}"
        state: absent

    - name: Load inlined hostname capture validation contract
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_capture_contract_source: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/capture_hostname_transfer_batch.yml'
            )
          }}
        switch_refresh_sda_fabric_edge_hostname_capture_contract_tasks: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/capture_hostname_transfer_batch.yml'
            ) |
            from_yaml
          }}
        switch_refresh_sda_fabric_edge_hostname_entry_helper_tasks: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/validate_hostname_transfer_entries.yml'
            ) |
            from_yaml
          }}
        switch_refresh_sda_fabric_edge_hostname_manifest_loader_source: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/load_hostname_transfer_manifest.yml'
            )
          }}
        switch_refresh_sda_fabric_edge_hostname_update_builder_source: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/build_hostname_update_batch.yml'
            )
          }}

    - name: Verify hostname capture uses the common entry helper
      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_hostname_capture_contract_tasks |
            selectattr(
              'name',
              'equalto',
              'Validate hostname transfer mapping coverage and uniqueness'
            ) |
            list |
            length == 1
          - >-
            switch_refresh_sda_fabric_edge_hostname_capture_contract_tasks |
            selectattr(
              'name',
              'equalto',
              'Prove old hostnames belong only to mapped old devices'
            ) |
            list |
            length == 1
          - >-
            switch_refresh_sda_fabric_edge_hostname_capture_contract_tasks |
            selectattr(
              'name',
              'equalto',
              'Validate common captured hostname transfer entry schema'
            ) |
            list |
            length == 1
          - >-
            'validate_hostname_transfer_entries.yml' in
            switch_refresh_sda_fabric_edge_hostname_capture_contract_source
          - >-
            switch_refresh_sda_fabric_edge_hostname_entry_helper_tasks |
            selectattr(
              'name',
              'equalto',
              'Validate common hostname-transfer entry schema'
            ) |
            list |
            length == 1
          - >-
            'case-insensitively unique LAN Automation hostname labels' in
            switch_refresh_sda_fabric_edge_hostname_capture_contract_source
          - >-
            'Derive batched LAN Automation hostname labels' not in
            switch_refresh_sda_fabric_edge_hostname_capture_contract_source
          - >-
            'validate_hostname_transfer_entries.yml' in
            switch_refresh_sda_fabric_edge_hostname_manifest_loader_source
          - >-
            'Validate hostname transfer manifest device entries' not in
            switch_refresh_sda_fabric_edge_hostname_manifest_loader_source
          - >-
            'validate_hostname_transfer_entries.yml' in
            switch_refresh_sda_fabric_edge_hostname_update_builder_source
          - >-
            'Validate captured hostname transfer entries' not in
            switch_refresh_sda_fabric_edge_hostname_update_builder_source
          - >-
            'validate_hostname_transfer_capture.yml' not in
            switch_refresh_sda_fabric_edge_hostname_capture_contract_source
          - >-
            'validate_hostname_transfer_ownership.yml' not in
            switch_refresh_sda_fabric_edge_hostname_capture_contract_source

    - name: Initialize Discovery hostname capture facts
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_cleanup_batch_name: discovery-hostname-transfer
        switch_refresh_sda_fabric_edge_batch_resolved_mappings: >-
          {{ switch_refresh_sda_fabric_edge_hostname_test_mappings }}
        switch_refresh_sda_fabric_edge_hostname_transfer_inventory_entries: >-
          {{ switch_refresh_sda_fabric_edge_hostname_test_inventory }}
        switch_refresh_sda_fabric_edge_hostname_transfer_enriched_mappings: []
        switch_refresh_sda_fabric_edge_hostname_transfer_entries: []

    - name: Capture live names for a Discovery-onboarded batch
      ansible.builtin.include_tasks: >-
        ../tasks/build_hostname_transfer_mapping.yml
      loop: "{{ switch_refresh_sda_fabric_edge_batch_resolved_mappings }}"
      loop_control:
        loop_var: switch_refresh_sda_fabric_edge_hostname_mapping_to_build

    - name: Validate common Discovery hostname capture entry schema
      ansible.builtin.include_tasks: >-
        ../tasks/validate_hostname_transfer_entries.yml
      vars:
        switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_request:
          entries: "{{ switch_refresh_sda_fabric_edge_hostname_transfer_entries }}"
          context: offline Discovery hostname capture

    - name: Use normalized Discovery hostname capture entries
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_transfer_entries: >-
          {{ switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entries }}

    - name: Validate Discovery hostname capture
      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_enriched_mappings | length ==
            switch_refresh_sda_fabric_edge_batch_resolved_mappings | length
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entry_count ==
            switch_refresh_sda_fabric_edge_batch_resolved_mappings | length
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.old_hostnames |
            list ==
            ['OLD-EDGE-01.example.test', 'old-edge-02.example.test']
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.old_hostnames |
            map('lower') |
            unique |
            length ==
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entry_count
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.old_device_uuids |
            unique |
            length ==
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entry_count
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.new_device_uuids |
            unique |
            length ==
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entry_count
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.new_management_ips
            == ['192.0.2.20', '192.0.2.21']
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.submission_labels
            == ['OLD-EDGE-01', 'old-edge-02']

    - name: Save enriched Discovery hostname mappings
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_batch_resolved_mappings: >-
          {{ switch_refresh_sda_fabric_edge_hostname_transfer_enriched_mappings }}

    - name: Save valid Discovery hostname transfer entries
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_test_discovery_entries: >-
          {{ switch_refresh_sda_fabric_edge_hostname_transfer_entries }}

    - name: Normalize whitespace in a common hostname transfer entry
      ansible.builtin.include_tasks: >-
        ../tasks/validate_hostname_transfer_entries.yml
      vars:
        switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_request:
          entries:
            - >-
              {{
                switch_refresh_sda_fabric_edge_hostname_test_discovery_entries[0] |
                combine(
                  {
                    'old_hostname': '  OLD-EDGE-01.example.test  ',
                    'new_management_ip': '  192.0.2.20  '
                  }
                )
              }}
          context: whitespace normalization fixture

    - name: Verify normalized entry values and preserved state
      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entries[0].old_hostname
            == 'OLD-EDGE-01.example.test'
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.new_management_ips
            == ['192.0.2.20']
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.submission_labels
            == ['OLD-EDGE-01']
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entries[0].status
            == 'captured'

    - name: Reject an incomplete common hostname transfer entry
      block:
        - name: Validate an entry missing its replacement serial number
          ansible.builtin.include_tasks: >-
            ../tasks/validate_hostname_transfer_entries.yml
          vars:
            switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_request:
              entries:
                - old_management_ip: "198.51.100.20"
                  old_hostname: OLD-EDGE-01.example.test
                  old_device_uuid: old-uuid-01
                  old_serial_number: OLD-SERIAL-01
                  new_management_ip: "192.0.2.20"
                  new_device_uuid: new-uuid-01
              context: incomplete offline hostname entry

        - name: Fail when an incomplete common entry was accepted
          ansible.builtin.fail:
            msg: Incomplete common hostname transfer entry unexpectedly passed.
      rescue:
        - name: Verify common entry schema failed before workflow submission
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate common hostname-transfer entry schema'
              - >-
                'requires non-empty string values' in
                (ansible_failed_result | string)

    - name: Initialize captured hostname ownership fixtures
      ansible.builtin.set_fact:
        network_devices_info_result:
          response:
            - hostname-ownership-fixture
        switch_refresh_sda_fabric_edge_hostname_transfer_owner_entries:
          - device_ip: "198.51.100.20"
            device_details:
              - hostname: OLD-EDGE-01.example.test
                instanceUuid: old-uuid-01
          - device_ip: "198.51.100.21"
            device_details:
              - hostname: old-edge-02.example.test
                instanceUuid: old-uuid-02
        switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids:
          - old-uuid-01
          - old-uuid-02
        switch_refresh_sda_fabric_edge_hostname_transfer_owner_hostnames:
          - old-edge-01.example.test
          - old-edge-02.example.test

    - name: Validate captured hostname ownership fixture structure
      ansible.builtin.assert:
        that:
          - network_devices_info_result.response is defined
          - switch_refresh_sda_fabric_edge_hostname_owner_item is mapping
          - switch_refresh_sda_fabric_edge_hostname_owner_item.device_ip is defined
          - switch_refresh_sda_fabric_edge_hostname_owner_item.device_details is defined
          - >-
            (switch_refresh_sda_fabric_edge_hostname_owner_item.device_details | type_debug) ==
            'list'
          - switch_refresh_sda_fabric_edge_hostname_owner_item.device_details | length == 1
          - switch_refresh_sda_fabric_edge_hostname_owner_item.device_details[0] is mapping
      loop: "{{ switch_refresh_sda_fabric_edge_hostname_transfer_owner_entries }}"
      loop_control:
        loop_var: switch_refresh_sda_fabric_edge_hostname_owner_item
        label: "{{ switch_refresh_sda_fabric_edge_hostname_owner_item.device_ip }}"

    - name: Prove captured hostnames belong to mapped old devices offline
      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_owner_entries | length ==
            switch_refresh_sda_fabric_edge_hostname_transfer_entries | length
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids |
            reject('equalto', '') |
            list |
            length == switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids | length
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids |
            unique |
            length == switch_refresh_sda_fabric_edge_hostname_transfer_entries | length
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids | sort ==
            switch_refresh_sda_fabric_edge_hostname_transfer_entries |
            map(attribute='old_device_uuid') |
            list |
            sort
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_owner_hostnames | sort ==
            switch_refresh_sda_fabric_edge_hostname_transfer_entries |
            map(attribute='old_hostname') |
            map('lower') |
            list |
            sort

    - name: Reject third-party ownership during hostname capture
      block:
        - name: Set a third-party captured hostname owner
          ansible.builtin.set_fact:
            switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids:
              - unrelated-owner-uuid
              - old-uuid-02

        - name: Prove old hostnames belong only to mapped old devices offline
          ansible.builtin.assert:
            that:
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_owner_entries | length ==
                switch_refresh_sda_fabric_edge_hostname_transfer_entries | length
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids |
                reject('equalto', '') |
                list |
                length == switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids | length
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids |
                unique |
                length == switch_refresh_sda_fabric_edge_hostname_transfer_entries | length
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids | sort ==
                switch_refresh_sda_fabric_edge_hostname_transfer_entries |
                map(attribute='old_device_uuid') |
                list |
                sort
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_owner_hostnames | sort ==
                switch_refresh_sda_fabric_edge_hostname_transfer_entries |
                map(attribute='old_hostname') |
                map('lower') |
                list |
                sort

        - name: Fail when third-party captured ownership was accepted
          ansible.builtin.fail:
            msg: Third-party captured hostname ownership unexpectedly passed.
      rescue:
        - name: Verify third-party captured ownership failed closed
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Prove old hostnames belong only to mapped old devices offline'
              - >-
                'switch_refresh_sda_fabric_edge_hostname_transfer_owner_uuids | sort' in
                (ansible_failed_result.assertion | string)

    - name: Verify desired names came only from live old-device records
      ansible.builtin.assert:
        that:
          - switch_refresh_sda_fabric_edge_hostname_transfer_entries | length == 2
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entries |
            map(attribute='old_hostname') |
            list ==
            ['OLD-EDGE-01.example.test', 'old-edge-02.example.test']
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entries |
            map(attribute='new_management_ip') |
            list == ['192.0.2.20', '192.0.2.21']
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entries |
            map(attribute='status') |
            unique |
            list == ['captured']
          - >-
            switch_refresh_sda_fabric_edge_hostname_test_mappings |
            selectattr('new_host_name', 'defined') |
            list |
            length == 0

    - name: Validate capture-time LAN Automation hostname label cases
      ansible.builtin.assert:
        that:
          - >-
            (
              switch_refresh_sda_fabric_edge_hostname_capture_case_labels |
              reject('equalto', '') |
              list |
              length == switch_refresh_sda_fabric_edge_hostname_capture_case.hostnames | length
              and
              switch_refresh_sda_fabric_edge_hostname_capture_case_labels |
              map('length') |
              max <= 63
              and
              switch_refresh_sda_fabric_edge_hostname_capture_case_labels |
              map('lower') |
              unique |
              length == switch_refresh_sda_fabric_edge_hostname_capture_case_labels | length
            ) == switch_refresh_sda_fabric_edge_hostname_capture_case.expected_valid
      vars:
        switch_refresh_sda_fabric_edge_hostname_capture_case_labels: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_capture_case.hostnames |
            map('regex_replace', '\..*$', '') |
            map('trim') |
            list
          }}
      loop:
        - name: valid FQDN and short labels
          hostnames:
            - edge-one.example.test
            - EDGE-TWO
          expected_valid: true
        - name: case-insensitive FQDN label collision
          hostnames:
            - shared-edge.a.example.test
            - SHARED-EDGE.b.example.test
          expected_valid: false
        - name: empty leftmost label
          hostnames:
            - .example.test
          expected_valid: false
        - name: over-63-character leftmost label
          hostnames:
            - >-
              {{ ('a' * 64) ~ '.example.test' }}
          expected_valid: false
      loop_control:
        loop_var: switch_refresh_sda_fabric_edge_hostname_capture_case
        label: "{{ switch_refresh_sda_fabric_edge_hostname_capture_case.name }}"

    - name: Initialize LAN Automation hostname capture facts
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_cleanup_batch_name: lan-automation-hostname-transfer
        switch_refresh_sda_fabric_edge_batch_resolved_mappings:
          - old_management_ip: "198.51.100.20"
            new_device_management_ip: "192.0.2.20"
        switch_refresh_sda_fabric_edge_hostname_transfer_inventory_entries: >-
          {{ switch_refresh_sda_fabric_edge_hostname_test_inventory }}
        switch_refresh_sda_fabric_edge_hostname_transfer_enriched_mappings: []
        switch_refresh_sda_fabric_edge_hostname_transfer_entries: []

    - name: Capture live name for a LAN Automation-onboarded batch
      ansible.builtin.include_tasks: >-
        ../tasks/build_hostname_transfer_mapping.yml
      loop: "{{ switch_refresh_sda_fabric_edge_batch_resolved_mappings }}"
      loop_control:
        loop_var: switch_refresh_sda_fabric_edge_hostname_mapping_to_build

    - name: Validate common LAN Automation hostname capture entry schema
      ansible.builtin.include_tasks: >-
        ../tasks/validate_hostname_transfer_entries.yml
      vars:
        switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_request:
          entries: "{{ switch_refresh_sda_fabric_edge_hostname_transfer_entries }}"
          context: offline LAN Automation hostname capture

    - name: Use normalized LAN Automation hostname capture entries
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_transfer_entries: >-
          {{ switch_refresh_sda_fabric_edge_hostname_transfer_entry_validation_result.entries }}

    - name: Validate LAN Automation hostname capture
      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_enriched_mappings | length ==
            switch_refresh_sda_fabric_edge_batch_resolved_mappings | length
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entries | length ==
            switch_refresh_sda_fabric_edge_batch_resolved_mappings | length
          - switch_refresh_sda_fabric_edge_hostname_transfer_entries | length <= 100
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entries |
            map(attribute='old_hostname') |
            map('lower') |
            unique |
            length == switch_refresh_sda_fabric_edge_hostname_transfer_entries | length
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entries |
            map(attribute='old_device_uuid') |
            unique |
            length == switch_refresh_sda_fabric_edge_hostname_transfer_entries | length
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entries |
            map(attribute='new_device_uuid') |
            unique |
            length == switch_refresh_sda_fabric_edge_hostname_transfer_entries | length

    - name: Save enriched LAN Automation hostname mappings
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_batch_resolved_mappings: >-
          {{ switch_refresh_sda_fabric_edge_hostname_transfer_enriched_mappings }}

    - name: Verify onboarding method does not affect hostname capture
      ansible.builtin.assert:
        that:
          - switch_refresh_sda_fabric_edge_hostname_transfer_entries | length == 1
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entries[0].old_hostname ==
            'OLD-EDGE-01.example.test'
          - >-
            switch_refresh_sda_fabric_edge_hostname_transfer_entries[0].new_management_ip ==
            '192.0.2.20'

    - name: Set original Discovery input for durable resume fingerprint
      ansible.builtin.set_fact:
        refresh_item:
          name: discovery-hostname-transfer
          fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
          onboarding_method: discovery
          new_devices:
            device_ips:
              - "192.0.2.20"
              - "192.0.2.21"
          device_mapping:
            - old:
                serial_number: OLD-SERIAL-01
              new:
                management_ip: "192.0.2.20"
            - old:
                management_ip: "198.51.100.21"
              new:
                management_ip: "192.0.2.21"

    - name: Derive durable hostname transfer input fingerprint
      ansible.builtin.include_tasks: >-
        ../tasks/derive_hostname_transfer_input_fingerprint.yml

    - name: Persist pre-delete Discovery hostname transfer manifest
      ansible.builtin.include_tasks: >-
        ../tasks/persist_hostname_transfer_manifest.yml
      vars:
        switch_refresh_sda_fabric_edge_hostname_transfer_plan:
          name: discovery-hostname-transfer
          fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
          hostname_transfer_enabled: true
          hostname_transfer_manifest_file: >-
            {{ switch_refresh_sda_fabric_edge_hostname_test_manifest }}
          hostname_transfer_input_fingerprint: >-
            {{ switch_refresh_sda_fabric_edge_hostname_transfer_input_fingerprint }}
          hostname_transfer_entries: >-
