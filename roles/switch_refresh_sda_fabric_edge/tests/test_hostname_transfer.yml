            ../tasks/validate_fabric_membership_result.yml
          vars:
            switch_refresh_sda_fabric_edge_fabric_validation_request:
              site: Global/Test/Fabric
              expected_ips:
                - "192.0.2.20"
                - "192.0.2.21"
              expected_state: present
              query_role: EDGE_NODE
              response_role: EDGE_NODE
              context: malformed-fragment-offline-test
            switch_refresh_sda_fabric_edge_fabric_validation_raw_result:
              response:
                - - fabric_info:
                      - device_ip: "192.0.2.20"
                        fabric_details:
                          - deviceRoles:
                              - EDGE_NODE
                      - device_ip: "192.0.2.21"
                        fabric_details:
                          - deviceRoles:
                              - EDGE_NODE
                - - unexpected_fragment: []

        - name: Fail when malformed extra fabric fragment was accepted
          ansible.builtin.fail:
            msg: Malformed extra fabric response fragment unexpectedly passed.
      rescue:
        - name: Verify malformed extra fabric fragment failed closed
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate fabric membership response fragments'
              - >-
                'malformed or unexpected response fragment' in
                (ansible_failed_result | string)

    - name: Reject informational strings without structured payload
      block:
        - name: Validate informational-only fabric response
          ansible.builtin.include_tasks: >-
            ../tasks/validate_fabric_membership_result.yml
          vars:
            switch_refresh_sda_fabric_edge_fabric_validation_request:
              site: Global/Test/Fabric
              expected_ips:
                - "192.0.2.20"
              expected_state: present
              query_role: EDGE_NODE
              response_role: EDGE_NODE
              context: informational-only-offline-test
            switch_refresh_sda_fabric_edge_fabric_validation_raw_result:
              response:
                - Controller returned only informational text.

        - name: Fail when informational-only fabric response was accepted
          ansible.builtin.fail:
            msg: Informational-only fabric response unexpectedly passed.
      rescue:
        - name: Verify informational-only fabric response failed closed
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require canonical present fabric membership payload'
              - >-
                'exactly one structured fabric_info payload' in
                (ansible_failed_result | string)

    - name: Reject the absence sentinel in a present response
      block:
        - name: Validate present response containing the absence sentinel
          ansible.builtin.include_tasks: >-
            ../tasks/validate_fabric_membership_result.yml
          vars:
            switch_refresh_sda_fabric_edge_fabric_validation_request:
              site: Global/Test/Fabric
              expected_ips:
                - "192.0.2.20"
              expected_state: present
              query_role: EDGE_NODE
              response_role: EDGE_NODE
              context: present-absence-sentinel-offline-test
            switch_refresh_sda_fabric_edge_fabric_validation_raw_result:
              response:
                - No fabric devices found for the given filters.
                - - fabric_info:
                      - device_ip: "192.0.2.20"
                        fabric_details:
                          - deviceRoles:
                              - EDGE_NODE

        - name: Fail when presence accepted the absence sentinel
          ansible.builtin.fail:
            msg: Present fabric response accepted the absence sentinel.
      rescue:
        - name: Verify present-response absence sentinel failed closed
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate fabric membership response fragments'

    - name: Reject duplicate structured fabric payloads
      block:
        - name: Validate fabric response with duplicate structured payloads
          ansible.builtin.include_tasks: >-
            ../tasks/validate_fabric_membership_result.yml
          vars:
            switch_refresh_sda_fabric_edge_fabric_validation_request:
              site: Global/Test/Fabric
              expected_ips:
                - "192.0.2.20"
                - "192.0.2.21"
              expected_state: present
              query_role: EDGE_NODE
              response_role: EDGE_NODE
              context: duplicate-structured-payload-offline-test
            switch_refresh_sda_fabric_edge_fabric_validation_raw_result:
              response:
                - - fabric_info:
                      - device_ip: "192.0.2.20"
                        fabric_details:
                          - deviceRoles:
                              - EDGE_NODE
                - - fabric_info:
                      - device_ip: "192.0.2.21"
                        fabric_details:
                          - deviceRoles:
                              - EDGE_NODE

        - name: Fail when duplicate structured fabric payloads were accepted
          ansible.builtin.fail:
            msg: Duplicate structured fabric payloads unexpectedly passed.
      rescue:
        - name: Verify duplicate structured fabric payloads failed closed
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require canonical present fabric membership payload'

    - name: Validate query-filtered fabric record without explicit role check
      ansible.builtin.include_tasks: >-
        ../tasks/validate_fabric_membership_result.yml
      vars:
        switch_refresh_sda_fabric_edge_fabric_validation_request:
          site: Global/Test/Fabric
          expected_ips:
            - "192.0.2.20"
          expected_state: present
          query_role: EDGE_NODE
          response_role: ""
          context: query-role-only-offline-test
        switch_refresh_sda_fabric_edge_fabric_validation_raw_result:
          response:
            - - fabric_info:
                  - device_ip: "192.0.2.20"
                    fabric_details:
                      - {}

    - name: Reject hostname fabric record without explicit EDGE_NODE role
      block:
        - name: Validate hostname fabric record missing required role
          ansible.builtin.include_tasks: >-
            ../tasks/validate_fabric_membership_result.yml
          vars:
            switch_refresh_sda_fabric_edge_fabric_validation_request:
              site: Global/Test/Fabric
              expected_ips:
                - "192.0.2.20"
              expected_state: present
              query_role: EDGE_NODE
              response_role: EDGE_NODE
              context: response-role-offline-test
            switch_refresh_sda_fabric_edge_fabric_validation_raw_result:
              response:
                - - fabric_info:
                      - device_ip: "192.0.2.20"
                        fabric_details:
                          - deviceRoles:
                              - CONTROL_PLANE_NODE

        - name: Fail when missing response role was accepted
          ansible.builtin.fail:
            msg: Missing explicit EDGE_NODE response role unexpectedly passed.
      rescue:
        - name: Verify missing response role failed closed
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate required fabric membership response role'
              - >-
                'without required role EDGE_NODE' in
                (ansible_failed_result | string)

    - name: Build entries with a case-insensitive hostname collision
      block:
        - name: Initialize colliding hostname capture facts
          ansible.builtin.set_fact:
            switch_refresh_sda_fabric_edge_cleanup_batch_name: colliding-hostnames
            switch_refresh_sda_fabric_edge_batch_resolved_mappings: >-
              {{ switch_refresh_sda_fabric_edge_hostname_test_mappings }}
            switch_refresh_sda_fabric_edge_hostname_transfer_inventory_entries:
              - device_ip: "198.51.100.20"
                device_details:
                  - managementIpAddress: "198.51.100.20"
                    hostname: duplicate-edge.example.test
                    instanceUuid: collision-old-uuid-01
                    serialNumber: COLLISION-OLD-SERIAL-01
              - device_ip: "192.0.2.20"
                device_details:
                  - managementIpAddress: "192.0.2.20"
                    hostname: temporary-edge-01
                    instanceUuid: collision-new-uuid-01
                    serialNumber: COLLISION-NEW-SERIAL-01
                    managementState: Managed
                    reachabilityStatus: Reachable
                    role: ACCESS
              - device_ip: "198.51.100.21"
                device_details:
                  - managementIpAddress: "198.51.100.21"
                    hostname: DUPLICATE-EDGE.example.test
                    instanceUuid: collision-old-uuid-02
                    serialNumber: COLLISION-OLD-SERIAL-02
              - device_ip: "192.0.2.21"
                device_details:
                  - managementIpAddress: "192.0.2.21"
                    hostname: temporary-edge-02
                    instanceUuid: collision-new-uuid-02
                    serialNumber: COLLISION-NEW-SERIAL-02
                    managementState: Managed
                    reachabilityStatus: Reachable
                    role: ACCESS
            switch_refresh_sda_fabric_edge_hostname_transfer_enriched_mappings: []
            switch_refresh_sda_fabric_edge_hostname_transfer_entries: []

        - name: Build colliding hostname entries
          ansible.builtin.include_tasks: >-
            ../tasks/build_hostname_transfer_mapping.yml
          loop: "{{ switch_refresh_sda_fabric_edge_batch_resolved_mappings }}"
          loop_control:
            loop_var: switch_refresh_sda_fabric_edge_hostname_mapping_to_build

        - name: Validate colliding hostname entries
          ansible.builtin.assert:
            that:
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_enriched_mappings | length ==
                switch_refresh_sda_fabric_edge_batch_resolved_mappings | length
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_entries | length ==
                switch_refresh_sda_fabric_edge_batch_resolved_mappings | length
              - switch_refresh_sda_fabric_edge_hostname_transfer_entries | length <= 100
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_entries |
                map(attribute='old_hostname') |
                map('lower') |
                unique |
                length == switch_refresh_sda_fabric_edge_hostname_transfer_entries | length
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_entries |
                map(attribute='old_device_uuid') |
                unique |
                length == switch_refresh_sda_fabric_edge_hostname_transfer_entries | length
              - >-
                switch_refresh_sda_fabric_edge_hostname_transfer_entries |
                map(attribute='new_device_uuid') |
                unique |
                length == switch_refresh_sda_fabric_edge_hostname_transfer_entries | length
            fail_msg: >-
              Hostname transfer requires no more than 100 complete mappings with
              unique old hostnames, old identities, and replacement identities.

        - name: Fail when a hostname collision was accepted
          ansible.builtin.fail:
            msg: Case-insensitive hostname collision unexpectedly passed.
      rescue:
        - name: Verify hostname collision failed before cleanup
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate colliding hostname entries'
              - >-
                'unique old hostnames' in
                (ansible_failed_result | string | lower)

    - name: Load hostname finalizer task wiring offline
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_finalizer_source: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/finalize_hostname_batch.yml'
            )
          }}

    - name: Parse hostname finalizer task wiring
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_finalizer_tasks: >-
          {{ switch_refresh_sda_fabric_edge_hostname_finalizer_source | from_yaml }}

    - name: Select hostname finalizer execution block
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_finalizer_block: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_finalizer_tasks |
            selectattr(
              'name',
              'equalto',
              'Finalize replacement switch hostnames'
            ) |
            first
          }}

    - name: Derive hostname finalizer integration tasks
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_finalizer_inner_tasks: >-
          {{ switch_refresh_sda_fabric_edge_hostname_finalizer_block.block }}
        switch_refresh_sda_fabric_edge_hostname_serial_initializer: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_finalizer_block.block |
            selectattr(
              'name',
              'equalto',
              'Derive hostname finalization inventory lookup values'
            ) |
            first
          }}
        switch_refresh_sda_fabric_edge_hostname_manager_calls: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_finalizer_block.block |
            selectattr(
              'name',
              'equalto',
              'Submit aggregate LAN Automation hostname update'
            ) |
            list
          }}
        switch_refresh_sda_fabric_edge_hostname_async_status_calls: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_finalizer_block.block |
            selectattr(
              'name',
              'equalto',
              'Wait for bounded hostname update job completion'
            ) |
            list
          }}
        switch_refresh_sda_fabric_edge_hostname_wait_tasks: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_finalizer_block.block |
            selectattr(
              'name',
              'equalto',
              'Wait until LAN Automation is inactive before hostname update'
            ) |
            list
          }}

    - name: Verify bounded update-only LAN Automation integration
      ansible.builtin.assert:
        that:
          - switch_refresh_sda_fabric_edge_hostname_manager_calls | length == 1
          - switch_refresh_sda_fabric_edge_hostname_async_status_calls | length == 1
          - switch_refresh_sda_fabric_edge_hostname_wait_tasks | length == 1
          - >-
            (
              switch_refresh_sda_fabric_edge_hostname_serial_initializer[
                'ansible.builtin.set_fact'
              ].switch_refresh_sda_fabric_edge_hostname_old_serial_numbers |
              type_debug
            ) == 'list'
          - >-
            switch_refresh_sda_fabric_edge_hostname_serial_initializer[
              'ansible.builtin.set_fact'
            ].switch_refresh_sda_fabric_edge_hostname_old_serial_numbers | length == 0
          - >-
            switch_refresh_sda_fabric_edge_hostname_manager_calls[0][
              'cisco.catalystcenter.lan_automation_workflow_manager'
            ] is defined
          - >-
            switch_refresh_sda_fabric_edge_hostname_async_status_calls[0][
              'ansible.builtin.async_status'
            ] is defined
          - >-
            switch_refresh_sda_fabric_edge_hostname_wait_tasks[0][
              'ansible.builtin.include_tasks'
            ] == 'wait_for_lan_automation.yml'
          - >-
            'switch_refresh_sda_fabric_edge_hostname_transfer_timeout' in
            (switch_refresh_sda_fabric_edge_hostname_manager_calls[0]['async'] | string)
          - switch_refresh_sda_fabric_edge_hostname_manager_calls[0].poll | int == 0
          - >-
            switch_refresh_sda_fabric_edge_hostname_manager_calls[0][
              'cisco.catalystcenter.lan_automation_workflow_manager'
            ].config | length == 1
          - >-
            switch_refresh_sda_fabric_edge_hostname_manager_calls[0][
              'cisco.catalystcenter.lan_automation_workflow_manager'
            ].config[0].lan_automated_device_update.hostname_update_devices
            is defined
          - >-
            'switch_refresh_sda_fabric_edge_hostname_submitted_update_devices' in
            (
              switch_refresh_sda_fabric_edge_hostname_manager_calls[0][
                'cisco.catalystcenter.lan_automation_workflow_manager'
              ].config[0].lan_automated_device_update.hostname_update_devices |
              string
            )
          - >-
            (
              switch_refresh_sda_fabric_edge_hostname_finalizer_inner_tasks |
              map(attribute='name') |
              list
            ).index(
              'Wait until LAN Automation is inactive before hostname update'
            ) <
            (
              switch_refresh_sda_fabric_edge_hostname_finalizer_inner_tasks |
              map(attribute='name') |
              list
            ).index('Submit aggregate LAN Automation hostname update')
          - >-
            'plugins/modules/lan_automation_workflow_manager.py' not in
            switch_refresh_sda_fabric_edge_hostname_finalizer_source
          - >-
            'validate_hostname_transfer_entries.yml' in
            switch_refresh_sda_fabric_edge_hostname_finalizer_source
          - >-
            'Validate captured hostname finalization entries' not in
            switch_refresh_sda_fabric_edge_hostname_finalizer_source

    - name: Load public hostname-transfer phase contract offline
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_defaults_contract: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../defaults/main.yml'
            ) |
            from_yaml
          }}
        switch_refresh_sda_fabric_edge_hostname_main_contract_source: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/main.yml'
            )
          }}
        switch_refresh_sda_fabric_edge_hostname_main_contract_tasks: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/main.yml'
            ) |
            from_yaml
          }}
        switch_refresh_sda_fabric_edge_hostname_cleanup_contract_source: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/cleanup_batch.yml'
            )
          }}
        switch_refresh_sda_fabric_edge_hostname_cleanup_contract_tasks: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/cleanup_batch.yml'
            ) |
            from_yaml
          }}

    - name: Select two-phase hostname-transfer control tasks
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_hostname_normal_cleanup_task: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_main_contract_tasks |
            selectattr('name', 'equalto', 'Clean up old switch batches') |
            first
          }}
        switch_refresh_sda_fabric_edge_hostname_cleanup_preflight_task: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_main_contract_tasks |
            selectattr(
              'name',
              'equalto',
              'Preflight every old-switch cleanup batch'
            ) |
            first
          }}
        switch_refresh_sda_fabric_edge_hostname_manifest_persist_task: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_main_contract_tasks |
            selectattr(
              'name',
              'equalto',
              'Persist every validated hostname transfer manifest'
            ) |
            first
          }}
        switch_refresh_sda_fabric_edge_hostname_resume_load_task: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_main_contract_tasks |
            selectattr(
              'name',
              'equalto',
              'Load every hostname transfer manifest before cleanup resume'
            ) |
            first
          }}
        switch_refresh_sda_fabric_edge_hostname_resume_execute_task: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_main_contract_tasks |
            selectattr(
              'name',
              'equalto',
              'Resume replacement hostname batches from manifests'
            ) |
            first
          }}
        switch_refresh_sda_fabric_edge_hostname_normal_finalize_task: >-
          {{
            switch_refresh_sda_fabric_edge_hostname_cleanup_contract_tasks |
            selectattr(
              'name',
              'equalto',
              'Finalize replacement hostnames from captured old-device names'
            ) |
            first
          }}

    - name: Verify two-phase cleanup resume contract
      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_hostname_defaults_contract.switch_refresh_sda_fabric_edge_phase ==
            'prepare'
          - >-
            switch_refresh_sda_fabric_edge_hostname_defaults_contract.switch_refresh_sda_fabric_edge_hostname_transfer_resume_from_manifest
            is defined
          - >-
            not (
              switch_refresh_sda_fabric_edge_hostname_defaults_contract.switch_refresh_sda_fabric_edge_hostname_transfer_resume_from_manifest |
              bool
            )
          - >-
            switch_refresh_sda_fabric_edge_hostname_main_contract_tasks[0][
              'ansible.builtin.assert'
            ].that[0] ==
            "switch_refresh_sda_fabric_edge_phase in ['prepare', 'cleanup_old']"
          - >-
            'switch_refresh_sda_fabric_edge_hostname_transfer_resume_from_manifest' in
            switch_refresh_sda_fabric_edge_hostname_main_contract_source
          - >-
            'finalize_hostname_batch.yml' in
            switch_refresh_sda_fabric_edge_hostname_cleanup_contract_source
          - >-
            'switch_refresh_sda_fabric_edge_hostname_transfer_auto_finalize' not in
            switch_refresh_sda_fabric_edge_hostname_defaults_contract | string
          - >-
            'switch_refresh_sda_fabric_edge_hostname_transfer_auto_finalize' not in
            switch_refresh_sda_fabric_edge_hostname_main_contract_source
          - >-
            'switch_refresh_sda_fabric_edge_hostname_transfer_auto_finalize' not in
            switch_refresh_sda_fabric_edge_hostname_cleanup_contract_source
          - >-
            'finalize_hostnames' not in
            switch_refresh_sda_fabric_edge_hostname_main_contract_source
          - >-
            switch_refresh_sda_fabric_edge_hostname_main_contract_source.count(
              'validate_hostname_transfer_entries.yml'
            ) == 2
          - >-
            'Derive all-batch hostname transfer safety keys' not in
            switch_refresh_sda_fabric_edge_hostname_main_contract_source
          - >-
            'Derive hostname-transfer resume safety keys' not in
            switch_refresh_sda_fabric_edge_hostname_main_contract_source
          - >-
            switch_refresh_sda_fabric_edge_hostname_normal_cleanup_task.when ==
            ['switch_refresh_sda_fabric_edge_normal_cleanup_mode | bool']
          - >-
            switch_refresh_sda_fabric_edge_hostname_cleanup_preflight_task.when ==
            ['switch_refresh_sda_fabric_edge_normal_cleanup_mode | bool']
          - >-
            switch_refresh_sda_fabric_edge_hostname_manifest_persist_task.when ==
            [
              'switch_refresh_sda_fabric_edge_normal_cleanup_mode | bool',
              'switch_refresh_sda_fabric_edge_hostname_transfer_enabled | bool'
            ]
          - >-
            switch_refresh_sda_fabric_edge_hostname_resume_load_task.when ==
            ['switch_refresh_sda_fabric_edge_manifest_resume_mode | bool']
          - >-
            switch_refresh_sda_fabric_edge_hostname_resume_execute_task.when ==
            ['switch_refresh_sda_fabric_edge_manifest_resume_mode | bool']
          - >-
            switch_refresh_sda_fabric_edge_hostname_main_contract_tasks.index(
              switch_refresh_sda_fabric_edge_hostname_resume_load_task
            ) <
            switch_refresh_sda_fabric_edge_hostname_main_contract_tasks.index(
              switch_refresh_sda_fabric_edge_hostname_resume_execute_task
            )
          - >-
            switch_refresh_sda_fabric_edge_hostname_normal_finalize_task.when ==
            ['switch_refresh_sda_fabric_edge_cleanup_batch_hostname_transfer_enabled | bool']

    - name: Reject the removed finalize_hostnames phase
      block:
        - name: Run removed hostname finalization phase
          ansible.builtin.include_tasks: ../tasks/main.yml
          vars:
            switch_refresh_sda_fabric_edge_phase: finalize_hostnames
            switch_refresh_sda_fabric_edge_cleanup_old: false
            switch_refresh_sda_fabric_edge_hostname_transfer_enabled: true
            switch_refresh_sda_fabric_edge_hostname_transfer_resume_from_manifest: false
            switch_refresh_sda_fabric_edge_hostname_transfer_manifest_dir: >-
              {{ switch_refresh_sda_fabric_edge_hostname_test_dir }}
            switch_refresh_sda_fabric_edge_batches: >-
              {{ switch_refresh_sda_fabric_edge_hostname_test_control_batches }}

        - name: Fail when removed hostname phase was accepted
          ansible.builtin.fail:
            msg: Removed finalize_hostnames phase unexpectedly passed.
      rescue:
        - name: Verify removed hostname phase failed validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate switch refresh control variables'
              - >-
                'must be prepare or cleanup_old' in
                (ansible_failed_result | string)

    - name: Reject destructive approval during manifest resume
      block:
        - name: Run conflicting cleanup and manifest resume controls
          ansible.builtin.include_tasks: ../tasks/main.yml
          vars:
            switch_refresh_sda_fabric_edge_phase: cleanup_old
            switch_refresh_sda_fabric_edge_cleanup_old: true
            switch_refresh_sda_fabric_edge_hostname_transfer_enabled: true
            switch_refresh_sda_fabric_edge_hostname_transfer_resume_from_manifest: true
            switch_refresh_sda_fabric_edge_hostname_transfer_manifest_dir: >-
              {{ switch_refresh_sda_fabric_edge_hostname_test_dir }}
            switch_refresh_sda_fabric_edge_batches: >-
              {{ switch_refresh_sda_fabric_edge_hostname_test_control_batches }}

        - name: Fail when destructive manifest resume was accepted
          ansible.builtin.fail:
            msg: Destructive approval unexpectedly passed manifest resume.
      rescue:
        - name: Verify destructive manifest resume failed validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate cleanup execution controls'
              - >-
                'manifest resume requires cleanup_old phase' in
                (ansible_failed_result | string | lower)

    - name: Reject manifest resume when hostname transfer is disabled
      block:
        - name: Run disabled hostname transfer resume controls
          ansible.builtin.include_tasks: ../tasks/main.yml
          vars:
            switch_refresh_sda_fabric_edge_phase: cleanup_old
            switch_refresh_sda_fabric_edge_cleanup_old: false
            switch_refresh_sda_fabric_edge_hostname_transfer_enabled: false
            switch_refresh_sda_fabric_edge_hostname_transfer_resume_from_manifest: true
            switch_refresh_sda_fabric_edge_batches: >-
              {{ switch_refresh_sda_fabric_edge_hostname_test_control_batches }}

        - name: Fail when disabled hostname transfer resume was accepted
          ansible.builtin.fail:
            msg: Disabled hostname transfer unexpectedly passed resume.
      rescue:
        - name: Verify disabled hostname transfer resume failed validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate hostname transfer controls'
              - >-
                'requires hostname transfer to be enabled' in
                (ansible_failed_result | string | lower)

    - name: Remove hostname transfer test directory
      ansible.builtin.file:
        path: "{{ switch_refresh_sda_fabric_edge_hostname_test_dir }}"
        state: absent
