---
- name: Validate switch refresh batch planning offline
  hosts: plan_test
  gather_facts: false
  vars:
    switch_refresh_sda_fabric_edge_onboarding_method: discovery
    switch_refresh_sda_fabric_edge_work_dir: /tmp/catalystcenter_switch_refresh_sda_fabric_edge-plan-test
    switch_refresh_sda_fabric_edge_inventory_credentials:
      username: test-user
      password: test-password
      enable_password: test-enable-password
      cli_transport: ssh
      type: NETWORK_DEVICE
    switch_refresh_sda_fabric_edge_discovery_enabled: true
    switch_refresh_sda_fabric_edge_lan_automation_enabled: true
    switch_refresh_sda_fabric_edge_inventory_enabled: true
    switch_refresh_sda_fabric_edge_inventory_role_update_enabled: true
    switch_refresh_sda_fabric_edge_provision_enabled: true
    switch_refresh_sda_fabric_edge_fabric_add_enabled: true
    switch_refresh_sda_fabric_edge_host_onboarding_enabled: true
  tasks:
    - name: Load host-port migration filter construction contract
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_migration_filter_contract_tasks: >-
          {{
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../tasks/prepare_batch_host_onboarding.yml'
            ) |
            from_yaml
          }}

    - name: Select host-port migration filter construction task
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_migration_filter_contract_task: >-
          {{
            switch_refresh_sda_fabric_edge_migration_filter_contract_tasks |
            selectattr(
              'name',
              'equalto',
              'Build host-port migration batch filters'
            ) |
            first
          }}

    - name: Verify only-mapped control is forwarded to both migration components
      ansible.builtin.assert:
        that:
          - >-
            'only_mapped_interfaces' in
            switch_refresh_sda_fabric_edge_migration_filter_contract_task[
              'ansible.builtin.set_fact'
            ].switch_refresh_sda_fabric_edge_batch_port_assignment_filters |
            string
          - >-
            'only_mapped_interfaces' in
            switch_refresh_sda_fabric_edge_migration_filter_contract_task[
              'ansible.builtin.set_fact'
            ].switch_refresh_sda_fabric_edge_batch_port_channel_filters |
            string
          - >-
            'switch_refresh_sda_fabric_edge_migration_mapping.only_mapped_interfaces' in
            switch_refresh_sda_fabric_edge_migration_filter_contract_task[
              'ansible.builtin.set_fact'
            ].switch_refresh_sda_fabric_edge_batch_port_assignment_filters |
            string
          - >-
            'switch_refresh_sda_fabric_edge_migration_mapping.only_mapped_interfaces' in
            switch_refresh_sda_fabric_edge_migration_filter_contract_task[
              'ansible.builtin.set_fact'
            ].switch_refresh_sda_fabric_edge_batch_port_channel_filters |
            string

    - name: Set valid two-device Discovery batch
      ansible.builtin.set_fact:
        refresh_item:
          name: valid-discovery-batch
          fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
          onboarding_method: discovery
          new_devices:
            device_ips:
              - "192.0.2.20"
              - "192.0.2.21"
          device_mapping:
            - old:
                hostname: old-edge-01.example.test
              new:
                management_ip: "192.0.2.20"
              interface_migration:
                port_assignments:
                  - source: GigabitEthernet1/0/5
                    destination: GigabitEthernet1/0/4
                port_channels: []
                only_mapped: true
            - old:
                serial_number: OLD-SERIAL-0002
              new:
                management_ip: "192.0.2.21"
              interface_migration:
                port_assignments: []
                port_channels:
                  - source: GigabitEthernet1/0/47
                    destination: TenGigabitEthernet1/1/1

    - name: Build valid Discovery batch plan
      ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

    - name: Verify generated Discovery batch plan
      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_batch_device_ips ==
            ['192.0.2.20', '192.0.2.21']
          - switch_refresh_sda_fabric_edge_batch_discovery_config | length == 1
          - >-
            switch_refresh_sda_fabric_edge_batch_discovery_config[0].discovery_type ==
            'MULTI RANGE'
          - >-
            switch_refresh_sda_fabric_edge_batch_discovery_config[0].ip_address_list ==
            switch_refresh_sda_fabric_edge_batch_device_ips
          - switch_refresh_sda_fabric_edge_batch_inventory_config | length == 1
          - >-
            switch_refresh_sda_fabric_edge_batch_inventory_config[0].ip_address_list ==
            switch_refresh_sda_fabric_edge_batch_device_ips
          - switch_refresh_sda_fabric_edge_batch_inventory_execution_config | length == 1
          - >-
            switch_refresh_sda_fabric_edge_batch_inventory_execution_config[0].role ==
            'ACCESS'
          - switch_refresh_sda_fabric_edge_batch_provision_config | length == 2
          - >-
            switch_refresh_sda_fabric_edge_batch_provision_config |
            map(attribute='management_ip_address') |
            list == switch_refresh_sda_fabric_edge_batch_device_ips
          - switch_refresh_sda_fabric_edge_batch_fabric_devices_config | length == 1
          - >-
            switch_refresh_sda_fabric_edge_batch_fabric_devices_config[0].fabric_devices.device_config |
            map(attribute='device_ip') |
            list == switch_refresh_sda_fabric_edge_batch_device_ips
          - >-
            switch_refresh_sda_fabric_edge_batch_fabric_devices_config[0].fabric_devices.device_config |
            map(attribute='device_roles') |
            list == [['EDGE_NODE'], ['EDGE_NODE']]
          - switch_refresh_sda_fabric_edge_batch_device_mappings | length == 2
          - >-
            switch_refresh_sda_fabric_edge_batch_device_mappings[0].port_assignment_interface_mappings |
            length == 1
          - >-
            switch_refresh_sda_fabric_edge_batch_device_mappings[0].port_assignment_interface_mappings
            ==
            [
              {
                'source_interface_name': 'GigabitEthernet1/0/5',
                'destination_interface_name': 'GigabitEthernet1/0/4'
              }
            ]
          - >-
            switch_refresh_sda_fabric_edge_batch_device_mappings[1].port_channel_interface_mappings |
            length == 1
          - >-
            switch_refresh_sda_fabric_edge_batch_device_mappings[1].port_channel_interface_mappings
            ==
            [
              {
                'source_interface_name': 'GigabitEthernet1/0/47',
                'destination_interface_name': 'TenGigabitEthernet1/1/1'
              }
            ]
          - >-
            switch_refresh_sda_fabric_edge_batch_device_mappings[0].only_mapped_interfaces is
            sameas true
          - >-
            switch_refresh_sda_fabric_edge_batch_device_mappings[1].only_mapped_interfaces is
            sameas false

    - name: Set generated Discovery chunking batch
      ansible.builtin.set_fact:
        refresh_item:
          name: generated-discovery-chunking
          fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
          onboarding_method: discovery
          new_devices:
            device_ips:
              - "192.0.2.100"
              - "192.0.2.101"
              - "192.0.2.102"
              - "192.0.2.103"
              - "192.0.2.104"
              - "192.0.2.105"
              - "192.0.2.106"
              - "192.0.2.107"
              - "192.0.2.108"

    - name: Build generated Discovery chunking batch plan
      ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml
      vars:
        switch_refresh_sda_fabric_edge_host_onboarding_enabled: false

    - name: Verify generated Discovery chunking behavior
      ansible.builtin.assert:
        that:
          - switch_refresh_sda_fabric_edge_batch_discovery_config | length == 2
          - >-
            switch_refresh_sda_fabric_edge_batch_discovery_config |
            map(attribute='discovery_name') |
            list ==
            [
              'switch-refresh-generated-discovery-chunking-1',
              'switch-refresh-generated-discovery-chunking-2'
            ]
          - >-
            switch_refresh_sda_fabric_edge_batch_discovery_config |
            map(attribute='discovery_type') |
            list == ['MULTI RANGE', 'SINGLE']
          - >-
            switch_refresh_sda_fabric_edge_batch_discovery_config[0].ip_address_list ==
            refresh_item.new_devices.device_ips[0:8]
          - >-
            switch_refresh_sda_fabric_edge_batch_discovery_config[1].ip_address_list ==
            refresh_item.new_devices.device_ips[8:9]

    - name: Verify invalid generated Discovery overrides are rejected
      block:
        - name: Set invalid generated Discovery override input
          ansible.builtin.set_fact:
            refresh_item:
              name: invalid-generated-discovery-override
              fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
              onboarding_method: discovery
              new_devices:
                device_ips:
                  - "192.0.2.22"
                protocol_order: ssh-first
                discovery_retry: "two"
                use_global_credentials: "yes"
              device_mapping:
                - old:
                    management_ip: "198.51.100.22"
                  new:
                    management_ip: "192.0.2.22"

        - name: Build invalid generated Discovery override input
          ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

        - name: Fail when invalid generated Discovery overrides were accepted
          ansible.builtin.fail:
            msg: Invalid generated Discovery overrides unexpectedly passed.
      rescue:
        - name: Confirm generated Discovery override validation failed
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate generated Discovery batch overrides'

    - name: Set valid fabric-zone LAN Automation batch
      ansible.builtin.set_fact:
        refresh_item:
          name: valid-fabric-zone-lan-automation-batch
          fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23/Floor1
          onboarding_method: lan_automation
          new_devices:
            device_ips:
              - "192.0.2.30"
              - "192.0.2.31"
            lan_automation_config:
              - lan_automation:
                  discovered_device_site_name_hierarchy: >-
                    Global/USA/San Jose/BLDG23
                  primary_device_management_ip_address: "198.51.100.10"
                  primary_device_interface_names:
                    - GigabitEthernet2/0/7
                  ip_pools:
                    - ip_pool_name: LAN_AUTO_MAIN
                      ip_pool_role: MAIN_POOL
                  discovery_devices:
                    - device_serial_number: NEW-SERIAL-0001
                      device_host_name: new-edge-01
                      device_site_name_hierarchy: >-
                        Global/USA/San Jose/BLDG23/Floor1
                      device_management_ip_address: "192.0.2.30"
                    - device_serial_number: NEW-SERIAL-0002
                      device_host_name: new-edge-02
                      device_site_name_hierarchy: >-
                        Global/USA/San Jose/BLDG23/Floor1
                      device_management_ip_address: "192.0.2.31"
                  launch_and_wait: true
          device_mapping:
            - old:
                management_ip: "198.51.100.30"
              new:
                management_ip: "192.0.2.30"
              interface_migration:
                port_assignments: []
                port_channels: []
            - old:
                mac_address: 00:11:22:33:44:55
              new:
                management_ip: "192.0.2.31"
              interface_migration:
                port_assignments: []
                port_channels: []

    - name: Build valid fabric-zone LAN Automation batch plan
      ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

    - name: Verify fabric-zone LAN Automation hierarchy targets
      ansible.builtin.assert:
        that:
          - switch_refresh_sda_fabric_edge_batch_onboarding_method == 'lan_automation'
          - >-
            switch_refresh_sda_fabric_edge_batch_new_devices.lan_automation_config[0].lan_automation.discovered_device_site_name_hierarchy ==
            'Global/USA/San Jose/BLDG23'
          - >-
            switch_refresh_sda_fabric_edge_batch_new_devices.lan_automation_config[0].lan_automation.discovery_devices |
            map(attribute='device_site_name_hierarchy') |
            unique |
            list == ['Global/USA/San Jose/BLDG23/Floor1']
          - >-
            switch_refresh_sda_fabric_edge_batch_fabric_devices_config[0].fabric_devices.fabric_name ==
            'Global/USA/San Jose/BLDG23/Floor1'
          - >-
            switch_refresh_sda_fabric_edge_batch_lan_automation_target_ips ==
            switch_refresh_sda_fabric_edge_batch_device_ips
          - >-
            switch_refresh_sda_fabric_edge_batch_lan_automation_serial_numbers ==
            ['NEW-SERIAL-0001', 'NEW-SERIAL-0002']
          - switch_refresh_sda_fabric_edge_batch_device_mappings | length == 2

    - name: Set fabric-zone LAN Automation input without optional device hierarchy
      ansible.builtin.set_fact:
        refresh_item:
          name: optional-lan-automation-device-zone
          fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23/Floor1
          onboarding_method: lan_automation
          new_devices:
            device_ips:
              - "192.0.2.69"
            lan_automation_config:
              - lan_automation:
                  discovered_device_site_name_hierarchy: >-
                    Global/USA/San Jose/BLDG23
                  discovery_devices:
                    - device_serial_number: NEW-SERIAL-0069
                      device_management_ip_address: "192.0.2.69"
                  launch_and_wait: true
          device_mapping:
            - old:
                management_ip: "198.51.100.69"
              new:
                management_ip: "192.0.2.69"

    - name: Build fabric-zone input without optional device hierarchy
      ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

    - name: Verify device site hierarchy remains optional
      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_batch_new_devices.lan_automation_config[0].lan_automation.discovery_devices[0].device_site_name_hierarchy
            is not defined

    - name: Verify partial LAN Automation hierarchy segment is rejected
      block:
        - name: Set partial-segment LAN Automation hierarchy input
          ansible.builtin.set_fact:
            refresh_item:
              name: partial-lan-automation-hierarchy-segment
              fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23/Floor1
              onboarding_method: lan_automation
              new_devices:
                device_ips:
                  - "192.0.2.70"
                lan_automation_config:
                  - lan_automation:
                      discovered_device_site_name_hierarchy: >-
                        Global/USA/San Jose/BLDG2
                      discovery_devices:
                        - device_serial_number: NEW-SERIAL-0070
                          device_site_name_hierarchy: >-
                            Global/USA/San Jose/BLDG23/Floor1
                          device_management_ip_address: "192.0.2.70"
                      launch_and_wait: true
              device_mapping:
                - old:
                    management_ip: "198.51.100.70"
                  new:
                    management_ip: "192.0.2.70"

        - name: Build partial-segment LAN Automation hierarchy input
          ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

        - name: Fail when partial hierarchy segment was accepted
          ansible.builtin.fail:
            msg: Partial LAN Automation hierarchy segment unexpectedly passed.
      rescue:
        - name: Confirm partial hierarchy segment failed validation
          ansible.builtin.assert:
            that:
              - >-
                'Partial hierarchy-segment matches are not accepted' in
                (ansible_failed_result | string)

    - name: Set valid disabled-launch LAN Automation resume batch
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_lan_automation_enabled: false
        refresh_item:
          name: valid-lan-automation-resume-batch
          fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
          onboarding_method: lan_automation
          new_devices:
            device_ips:
              - "192.0.2.68"
            lan_automation_config:
              - lan_automation:
                  discovered_device_site_name_hierarchy: >-
                    Global/USA/San Jose/BLDG23
                  discovery_devices:
                    - device_serial_number: NEW-SERIAL-0068
                      device_management_ip_address: "192.0.2.68"
                  launch_and_wait: true
          device_mapping:
            - old:
                management_ip: "198.51.100.68"
              new:
                management_ip: "192.0.2.68"

    - name: Build disabled-launch LAN Automation resume batch plan
      ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

    - name: Verify disabled LAN Automation launch retains its batch plan
      ansible.builtin.assert:
        that:
          - switch_refresh_sda_fabric_edge_batch_onboarding_method == 'lan_automation'
          - not (switch_refresh_sda_fabric_edge_lan_automation_enabled | bool)
          - >-
            switch_refresh_sda_fabric_edge_batch_lan_automation_target_ips == ['192.0.2.68']

    - name: Restore LAN Automation launch test toggle
      ansible.builtin.set_fact:
        switch_refresh_sda_fabric_edge_lan_automation_enabled: true

    - name: Set valid custom workflow batch
      ansible.builtin.set_fact:
        refresh_item:
          name: valid-custom-workflow-batch
          fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
          onboarding_method: discovery
          new_devices:
            device_ips:
              - "192.0.2.32"
              - "192.0.2.33"
            discovery_config:
              - discovery_name: custom-replacement-discovery
                discovery_type: MULTI RANGE
                ip_address_list:
                  - "192.0.2.32"
                  - "192.0.2.33"
                protocol_order: ssh
                use_global_credentials: true
            inventory_config:
              - ip_address_list:
                  - "192.0.2.32"
                  - "192.0.2.33"
                username: custom-user
                password: custom-password
                type: NETWORK_DEVICE
            provision_config:
              - site_name_hierarchy: Global/USA/San Jose/BLDG23
                management_ip_address: "192.0.2.32"
              - site_name_hierarchy: Global/USA/San Jose/BLDG23
                management_ip_address: "192.0.2.33"
            fabric_devices_config:
              - fabric_devices:
                  fabric_name: Global/USA/San Jose/BLDG23
                  device_config:
                    - device_ip: "192.0.2.32"
                      device_roles:
                        - EDGE_NODE
                    - device_ip: "192.0.2.33"
                      device_roles:
                        - EDGE_NODE
          device_mapping:
            - old:
                management_ip: "198.51.100.32"
              new:
                management_ip: "192.0.2.32"
              interface_migration:
                port_assignments: []
                port_channels: []
            - old:
                management_ip: "198.51.100.33"
              new:
                management_ip: "192.0.2.33"
              interface_migration:
                port_assignments: []
                port_channels: []

    - name: Build valid custom workflow batch plan
      ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

    - name: Verify complete custom workflow replacements
      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_batch_discovery_config ==
            refresh_item.new_devices.discovery_config
          - >-
            switch_refresh_sda_fabric_edge_batch_inventory_config ==
            refresh_item.new_devices.inventory_config
          - >-
            switch_refresh_sda_fabric_edge_batch_inventory_execution_config[0].role ==
            'ACCESS'
          - >-
            switch_refresh_sda_fabric_edge_batch_provision_config ==
            refresh_item.new_devices.provision_config
          - >-
            switch_refresh_sda_fabric_edge_batch_fabric_devices_config ==
            refresh_item.new_devices.fabric_devices_config

    - name: Verify disabled inventory role update rejects custom role
      block:
        - name: Set disabled custom inventory role input
          ansible.builtin.set_fact:
            switch_refresh_sda_fabric_edge_inventory_role_update_enabled: false
            refresh_item:
              name: disabled-custom-inventory-role
              fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
              onboarding_method: discovery
              new_devices:
                device_ips:
                  - "192.0.2.34"
                inventory_config:
                  - ip_address_list:
                      - "192.0.2.34"
                    username: custom-user
                    password: custom-password
                    type: NETWORK_DEVICE
                    role: ACCESS
              device_mapping:
                - old:
                    management_ip: "198.51.100.34"
                  new:
                    management_ip: "192.0.2.34"

        - name: Build disabled custom inventory role input
          ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

        - name: Fail when disabled custom inventory role was accepted
          ansible.builtin.fail:
            msg: Disabled custom inventory role unexpectedly passed.
      rescue:
        - name: Confirm disabled custom inventory role failed preflight
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate custom inventory batch entries'

        - name: Restore inventory role update test toggle
          ansible.builtin.set_fact:
            switch_refresh_sda_fabric_edge_inventory_role_update_enabled: true

    - name: Verify null fabric site is rejected
      block:
        - name: Set null fabric site input
          ansible.builtin.set_fact:
            refresh_item:
              name: null-fabric-site
              fabric_site_name_hierarchy: null
              onboarding_method: discovery
              new_devices:
                device_ips:
                  - "192.0.2.35"
              device_mapping:
                - old:
                    management_ip: "198.51.100.35"
                  new:
                    management_ip: "192.0.2.35"

        - name: Build null fabric site input
          ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

        - name: Fail when null fabric site was accepted
          ansible.builtin.fail:
            msg: Null fabric site unexpectedly passed validation.
      rescue:
        - name: Confirm null fabric site failed preflight
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate switch refresh batch structure'

    - name: Verify null generated inventory password is rejected
      block:
        - name: Set null generated inventory password input
          ansible.builtin.set_fact:
            refresh_item:
              name: null-generated-inventory-password
              fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
              onboarding_method: discovery
              new_devices:
                device_ips:
                  - "192.0.2.36"
                inventory_credentials:
                  username: test-user
                  password: null
              device_mapping:
                - old:
                    management_ip: "198.51.100.36"
                  new:
                    management_ip: "192.0.2.36"

        - name: Build null generated inventory password input
          ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

        - name: Fail when null generated inventory password was accepted
          ansible.builtin.fail:
            msg: Null generated inventory password unexpectedly passed.
      rescue:
        - name: Confirm null generated inventory password failed preflight
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate replacement switch batch inventory input'

    - name: Verify old-device aliases are rejected
      block:
        - name: Set old-device alias input
          ansible.builtin.set_fact:
            refresh_item:
              name: removed-old-alias
              fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
              onboarding_method: discovery
              new_devices:
                device_ips:
                  - "192.0.2.41"
              device_mapping:
                - old_device_hostname: old-edge.example.test
                  new:
                    management_ip: "192.0.2.41"

        - name: Build old-device alias input
          ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

        - name: Fail when old-device alias input was accepted
          ansible.builtin.fail:
            msg: Old-device alias unexpectedly passed validation.
      rescue:
        - name: Confirm old-device alias failed for the expected reason
          ansible.builtin.assert:
            that:
              - >-
                'accepts only old, new, and optional interface_migration' in
                (ansible_failed_result | string)

    - name: Verify ambiguous nested old identifiers are rejected
      block:
        - name: Set ambiguous old identifier input
          ansible.builtin.set_fact:
            refresh_item:
              name: ambiguous-old-identifier
              fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
              onboarding_method: discovery
              new_devices:
                device_ips:
                  - "192.0.2.42"
              device_mapping:
                - old:
                    hostname: old-edge.example.test
                    serial_number: OLD-SERIAL-0042
                  new:
                    management_ip: "192.0.2.42"

        - name: Build ambiguous old identifier input
          ansible.builtin.include_tasks: ../tasks/build_batch_plan.yml

        - name: Fail when ambiguous old identifier was accepted
          ansible.builtin.fail:
            msg: Ambiguous old identifier unexpectedly passed validation.
      rescue:
        - name: Confirm ambiguous identifier failed for the expected reason
          ansible.builtin.assert:
            that:
              - >-
