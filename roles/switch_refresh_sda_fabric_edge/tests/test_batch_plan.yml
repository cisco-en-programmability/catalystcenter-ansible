                onboarding_method: lan_automation
                new_devices:
                  device_ips:
                    - "192.0.2.84"
                  lan_automation_config:
                    - lan_automation:
                        discovered_device_site_name_hierarchy: >-
                          Global/USA/San Jose/BLDG23
                        discovery_devices:
                          - device_serial_number: SHARED-SERIAL-0084
                            device_management_ip_address: "192.0.2.84"
                        launch_and_wait: true
              - name: lan-serial-collision-second
