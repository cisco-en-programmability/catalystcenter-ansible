                        discovery_devices:
                          - device_serial_number: shared-serial-0084
                            device_management_ip_address: "192.0.2.85"
                        launch_and_wait: true

        - name: Run colliding LAN Automation serial preflight
          ansible.builtin.include_role:
            name: cisco.catalystcenter.switch_refresh_sda_fabric_edge

        - name: Fail when cross-batch LAN Automation serial was accepted
          ansible.builtin.fail:
            msg: Cross-batch LAN Automation serial unexpectedly passed.
      rescue:
        - name: Confirm LAN Automation serial collision failed preflight
          ansible.builtin.assert:
            that:
              - >-
