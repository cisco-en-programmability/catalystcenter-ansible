- name: Validate global switch refresh target safety offline
  hosts: safety_test
  gather_facts: false
  vars:
    switch_refresh_sda_fabric_edge_work_dir: /tmp/catalystcenter_switch_refresh_sda_fabric_edge-safety-test
    switch_refresh_sda_fabric_edge_discovery_enabled: false
    switch_refresh_sda_fabric_edge_inventory_enabled: false
    switch_refresh_sda_fabric_edge_inventory_role_update_enabled: false
    switch_refresh_sda_fabric_edge_device_info_lookup_enabled: false
    switch_refresh_sda_fabric_edge_provision_enabled: false
    switch_refresh_sda_fabric_edge_fabric_add_enabled: false
    switch_refresh_sda_fabric_edge_fabric_validation_enabled: false
    switch_refresh_sda_fabric_edge_cleanup_host_onboarding_enabled: false
    switch_refresh_sda_fabric_edge_cleanup_fabric_enabled: false
    switch_refresh_sda_fabric_edge_cleanup_unprovision_enabled: false
    switch_refresh_sda_fabric_edge_cleanup_inventory_enabled: false
  tasks:
    - name: Verify combined prepare and cleanup phase is rejected
      block:
        - name: Set removed combined phase input
          ansible.builtin.set_fact:
            switch_refresh_sda_fabric_edge_phase: all
            switch_refresh_sda_fabric_edge_cleanup_old: true
            switch_refresh_sda_fabric_edge_host_onboarding_enabled: false
            switch_refresh_sda_fabric_edge_batches:
              - name: removed-combined-phase
                fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
                onboarding_method: discovery
                new_devices:
                  device_ips:
                    - "192.0.2.79"

        - name: Run removed combined phase
          ansible.builtin.include_role:
            name: cisco.catalystcenter.switch_refresh_sda_fabric_edge

        - name: Fail when removed combined phase was accepted
          ansible.builtin.fail:
            msg: Removed combined phase unexpectedly passed validation.
      rescue:
        - name: Confirm removed combined phase failed before execution
          ansible.builtin.assert:
            that:
              - >-
                'must be prepare or cleanup_old' in
                (ansible_failed_result | string)

    - name: Verify prepare rejects an old target used by another batch
      block:
        - name: Set cross-batch prepare collision input
          ansible.builtin.set_fact:
            switch_refresh_sda_fabric_edge_phase: prepare
            switch_refresh_sda_fabric_edge_cleanup_old: false
            switch_refresh_sda_fabric_edge_host_onboarding_enabled: true
            switch_refresh_sda_fabric_edge_batches:
              - name: prepare-collision-first
                fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
                onboarding_method: discovery
                new_devices:
                  device_ips:
                    - "192.0.2.80"
                device_mapping:
                  - old:
                      management_ip: "192.0.2.81"
                    new:
                      management_ip: "192.0.2.80"
              - name: prepare-collision-second
                fabric_site_name_hierarchy: Global/USA/San Jose/BLDG24
                onboarding_method: discovery
                new_devices:
                  device_ips:
                    - "192.0.2.81"
                device_mapping:
                  - old:
                      management_ip: "198.51.100.81"
                    new:
                      management_ip: "192.0.2.81"

        - name: Run colliding prepare preflight
          ansible.builtin.include_role:
            name: cisco.catalystcenter.switch_refresh_sda_fabric_edge

        - name: Fail when cross-batch prepare collision was accepted
          ansible.builtin.fail:
            msg: Cross-batch prepare collision unexpectedly passed validation.
      rescue:
        - name: Confirm cross-batch prepare collision failed before execution
          ansible.builtin.assert:
            that:
              - >-
                'old device cannot be any replacement device' in
                (ansible_failed_result | string | lower)

    - name: Verify prepare rejects repeated LAN Automation serials
      block:
        - name: Set cross-batch LAN Automation serial collision input
          ansible.builtin.set_fact:
            switch_refresh_sda_fabric_edge_phase: prepare
            switch_refresh_sda_fabric_edge_cleanup_old: false
            switch_refresh_sda_fabric_edge_host_onboarding_enabled: false
            switch_refresh_sda_fabric_edge_lan_automation_enabled: true
            switch_refresh_sda_fabric_edge_batches:
