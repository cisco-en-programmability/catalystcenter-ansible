      ansible.builtin.assert:
        that:
          - >-
            switch_refresh_sda_fabric_edge_old_device_resolver_tasks |
            selectattr(
              'name',
              'equalto',
              'Validate old switch batch inventory records'
            ) |
            list |
            length == 1
          - >-
            switch_refresh_sda_fabric_edge_old_device_resolver_source.find(
              '- name: Validate old switch batch inventory records'
            ) <
            switch_refresh_sda_fabric_edge_old_device_resolver_source.find(
              '- name: Resolve management IP for every old-to-new batch mapping'
            )
          - >-
            switch_refresh_sda_fabric_edge_old_device_resolver_source.find(
              '- name: Validate old switch batch inventory records'
            ) >= 0
          - >-
            "(switch_refresh_sda_fabric_edge_old_info_item.device_details | type_debug) == 'list'"
            in
            switch_refresh_sda_fabric_edge_old_device_record_validation_contract[
              'ansible.builtin.assert'
            ].that
          - >-
            'switch_refresh_sda_fabric_edge_old_info_item.device_details | length == 1' in
            switch_refresh_sda_fabric_edge_old_device_record_validation_contract[
              'ansible.builtin.assert'
            ].that
          - >-
            'switch_refresh_sda_fabric_edge_old_info_item.device_details[0] is mapping' in
            switch_refresh_sda_fabric_edge_old_device_record_validation_contract[
              'ansible.builtin.assert'
            ].that
        fail_msg: >-
          Old-device inventory records must be validated before any mapping is
          resolved from the lookup response.

