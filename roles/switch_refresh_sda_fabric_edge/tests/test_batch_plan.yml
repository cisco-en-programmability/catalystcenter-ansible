        switch_refresh_sda_fabric_edge_old_device_record_validation_contract: >-
          {{
            switch_refresh_sda_fabric_edge_old_device_resolver_tasks |
            selectattr(
              'name',
              'equalto',
              'Validate old switch batch inventory records'
            ) |
            first
          }}

