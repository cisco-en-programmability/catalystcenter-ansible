---
# defaults file for switch_refresh_sda_fabric_edge
catalystcenter_host: ""
catalystcenter_username: ""
catalystcenter_password: ""
catalystcenter_verify: false
catalystcenter_port: 443
catalystcenter_version: "2.3.7.9"
catalystcenter_debug: false
catalystcenter_log_level: "INFO"
catalystcenter_log: false
catalystcenter_log_append: false
catalystcenter_log_file_path: catalystcenter.log

switch_refresh_sda_fabric_edge_phase: prepare
switch_refresh_sda_fabric_edge_batches: []
switch_refresh_sda_fabric_edge_cleanup_old: false
switch_refresh_sda_fabric_edge_work_dir: /tmp/catalystcenter_switch_refresh_sda_fabric_edge
switch_refresh_sda_fabric_edge_onboarding_method: discovery
switch_refresh_sda_fabric_edge_inventory_credentials: {}

switch_refresh_sda_fabric_edge_discovery_enabled: true
switch_refresh_sda_fabric_edge_swim_enabled: false
switch_refresh_sda_fabric_edge_lan_automation_enabled: true
switch_refresh_sda_fabric_edge_inventory_enabled: true
switch_refresh_sda_fabric_edge_inventory_role_update_enabled: true
switch_refresh_sda_fabric_edge_provision_enabled: true
switch_refresh_sda_fabric_edge_fabric_add_enabled: true
switch_refresh_sda_fabric_edge_fabric_validation_enabled: true
switch_refresh_sda_fabric_edge_host_onboarding_enabled: true
switch_refresh_sda_fabric_edge_cleanup_host_onboarding_enabled: true
switch_refresh_sda_fabric_edge_cleanup_fabric_enabled: true
switch_refresh_sda_fabric_edge_cleanup_unprovision_enabled: true
switch_refresh_sda_fabric_edge_cleanup_inventory_enabled: true

# Capture each old switch hostname during cleanup preflight and transfer it to
# the mapped replacement after the old inventory record has been removed.
# This is independent of whether the replacement was onboarded by Discovery or
# LAN Automation.
switch_refresh_sda_fabric_edge_hostname_transfer_enabled: false
switch_refresh_sda_fabric_edge_hostname_transfer_resume_from_manifest: false
# This must be set explicitly to a persistent controller-local directory when
# hostname transfer is enabled. The captured name is the only recovery source
# after the old inventory record is deleted, so an ephemeral /tmp default is
# deliberately unsafe.
switch_refresh_sda_fabric_edge_hostname_transfer_manifest_dir: ""
switch_refresh_sda_fabric_edge_hostname_transfer_timeout: 1200
switch_refresh_sda_fabric_edge_hostname_transfer_poll_interval: 10
switch_refresh_sda_fabric_edge_hostname_validation_retries: 12
switch_refresh_sda_fabric_edge_hostname_validation_interval: 10

switch_refresh_sda_fabric_edge_device_info_lookup_enabled: true
switch_refresh_sda_fabric_edge_device_info_lookup_timeout: 120
switch_refresh_sda_fabric_edge_device_info_lookup_retries: 6
switch_refresh_sda_fabric_edge_device_info_lookup_interval: 10
# Discovery and inventory workflows can return before Catalyst Center has
# completed device collection. Block provisioning until the direct inventory
# record exposes every field used by the provision workflow.
switch_refresh_sda_fabric_edge_inventory_readiness_timeout: 1200
switch_refresh_sda_fabric_edge_inventory_readiness_poll_interval: 10
# Independently prove the provisioning postcondition before a batch can advance
# to fabric enrollment. This also protects resume runs with provisioning off.
switch_refresh_sda_fabric_edge_provision_validation_timeout: 1200
switch_refresh_sda_fabric_edge_provision_validation_poll_interval: 10
switch_refresh_sda_fabric_edge_discovery_config_verify: false
switch_refresh_sda_fabric_edge_swim_config_verify: true
switch_refresh_sda_fabric_edge_lan_automation_config_verify: false
switch_refresh_sda_fabric_edge_lan_automation_completion_timeout: 604800
switch_refresh_sda_fabric_edge_lan_automation_completion_poll_interval: 30
switch_refresh_sda_fabric_edge_inventory_config_verify: false
switch_refresh_sda_fabric_edge_provision_config_verify: false
switch_refresh_sda_fabric_edge_sda_fabric_devices_config_verify: false
switch_refresh_sda_fabric_edge_sda_host_port_onboarding_config_verify: false
switch_refresh_sda_fabric_edge_sda_fabric_port_channel_limit: 20
switch_refresh_sda_fabric_edge_fabric_validation_timeout: 120
switch_refresh_sda_fabric_edge_fabric_validation_retries: 6
switch_refresh_sda_fabric_edge_fabric_validation_interval: 10
switch_refresh_sda_fabric_edge_allow_empty_host_port_config: false
