---
# Define these vault_* variables in an encrypted Ansible Vault file or another
# inventory-backed secret store. Do not place real credentials in this file.
catalystcenter_host: "{{ vault_catalystcenter_host }}"
catalystcenter_port: 443
catalystcenter_username: "{{ vault_catalystcenter_username }}"
catalystcenter_password: "{{ vault_catalystcenter_password }}"
catalystcenter_version: "2.3.7.9"
catalystcenter_verify: true
catalystcenter_debug: false
catalystcenter_log: false
catalystcenter_log_level: INFO

switch_refresh_sda_fabric_edge_work_dir: /tmp/catalystcenter_switch_refresh_sda_fabric_edge
switch_refresh_sda_fabric_edge_onboarding_method: discovery

# The desired replacement hostnames are captured from the live old-device
# inventory records during cleanup preflight. This works for both Discovery and
# LAN Automation onboarding and does not require hostname input for new devices.
switch_refresh_sda_fabric_edge_hostname_transfer_enabled: true
switch_refresh_sda_fabric_edge_hostname_transfer_resume_from_manifest: false
# Create this persistent directory with write access for the Ansible controller
# account before running cleanup (or choose another durable writable path).
switch_refresh_sda_fabric_edge_hostname_transfer_manifest_dir: >-
  /var/lib/catalystcenter_switch_refresh_sda_fabric_edge/hostname_transfer
switch_refresh_sda_fabric_edge_hostname_transfer_timeout: 1200
switch_refresh_sda_fabric_edge_hostname_transfer_poll_interval: 10
switch_refresh_sda_fabric_edge_hostname_validation_retries: 12
switch_refresh_sda_fabric_edge_hostname_validation_interval: 10

switch_refresh_sda_fabric_edge_inventory_credentials:
  username: "{{ vault_switch_cli_username }}"
  password: "{{ vault_switch_cli_password }}"
  enable_password: "{{ vault_switch_enable_password }}"
  cli_transport: ssh
  type: NETWORK_DEVICE

switch_refresh_sda_fabric_edge_device_info_lookup_enabled: true
switch_refresh_sda_fabric_edge_fabric_validation_enabled: true
# Opt in to preparing the requested golden image before each enabled LAN
# Automation launch. This does not distribute or activate the image directly;
# LAN Automation performs the supported day-zero installation.
switch_refresh_sda_fabric_edge_swim_enabled: true
switch_refresh_sda_fabric_edge_swim_config_verify: true
switch_refresh_sda_fabric_edge_lan_automation_completion_timeout: 604800
switch_refresh_sda_fabric_edge_lan_automation_completion_poll_interval: 30
switch_refresh_sda_fabric_edge_inventory_config_verify: true
switch_refresh_sda_fabric_edge_provision_config_verify: true
switch_refresh_sda_fabric_edge_sda_fabric_devices_config_verify: true
switch_refresh_sda_fabric_edge_sda_host_port_onboarding_config_verify: true

switch_refresh_sda_fabric_edge_batches:
  - name: sjc-bldg23-edge-refresh
    fabric_site_name_hierarchy: Global/USA/San Jose/BLDG23
    onboarding_method: lan_automation

    # This is the authoritative replacement-device set. All supplied workflow
    # configurations and device mappings must cover exactly these IPs.
    new_devices:
      device_ips:
        - "192.0.2.20"
        - "192.0.2.21"

      # Required for a LAN Automation batch when both SWIM preparation and the
      # LAN Automation launch are enabled. Use the exact Catalyst Center
      # image-family label. Site, device_role: ALL, and tagging: true are
      # derived/enforced by the refresh role. Keep each batch homogeneous by
      # image family.
      golden_image:
        image_name: cat9k_iosxe.17.12.04.SPA.bin
        device_image_family_name: Cisco Catalyst 9300 Switch
        # Omit import_image_details when the image already exists in the
        # Catalyst Center image repository. Remote URL credentials, if any,
        # must come from Ansible Vault or another secret store.
        # import_image_details:
        #   type: remote
        #   url_details:
        #     payload:
        #       - source_url:
        #           - "{{ vault_switch_golden_image_url }}"
        #         is_third_party: false

      lan_automation_config:
        - lan_automation:
            discovered_device_site_name_hierarchy: Global/USA/San Jose/BLDG23
            primary_device_management_ip_address: "198.51.100.10"
            primary_device_interface_names:
              - GigabitEthernet2/0/7
            ip_pools:
              - ip_pool_name: LAN_AUTO_MAIN
                ip_pool_role: MAIN_POOL
              - ip_pool_name: LAN_AUTO_P2P
                ip_pool_role: PHYSICAL_LINK_POOL
            multicast_enabled: true
            redistribute_isis_to_bgp: false
            discovery_level: 5
            discovery_timeout: 40
            discovery_devices:
              - device_serial_number: NEW-SERIAL-0001
                device_site_name_hierarchy: Global/USA/San Jose/BLDG23
                device_management_ip_address: "192.0.2.20"
              - device_serial_number: NEW-SERIAL-0002
                device_site_name_hierarchy: Global/USA/San Jose/BLDG23
                device_management_ip_address: "192.0.2.21"
            launch_and_wait: true
            pnp_authorization: true

      # For Discovery onboarding, set onboarding_method: discovery, remove
      # lan_automation_config, and rely on device_ips for generated input. A
      # complete custom Discovery replacement would look like this:
      # discovery_config:
      #   - discovery_name: sjc-bldg23-replacements
      #     discovery_type: MULTI RANGE
      #     ip_address_list:
      #       - "192.0.2.20"
      #       - "192.0.2.21"
      #     protocol_order: ssh
      #     retry: 2
      #     use_global_credentials: true

      # Optional complete inventory replacement. Its combined IP set must
      # exactly match device_ips. The role still enforces inventory role ACCESS.
      # inventory_config:
      #   - ip_address_list:
      #       - "192.0.2.20"
      #       - "192.0.2.21"
      #     username: "{{ vault_switch_cli_username }}"
      #     password: "{{ vault_switch_cli_password }}"
      #     enable_password: "{{ vault_switch_enable_password }}"
      #     cli_transport: ssh
      #     type: NETWORK_DEVICE

      # Optional complete provisioning replacement.
      # provision_config:
      #   - site_name_hierarchy: Global/USA/San Jose/BLDG23
      #     management_ip_address: "192.0.2.20"
      #   - site_name_hierarchy: Global/USA/San Jose/BLDG23
      #     management_ip_address: "192.0.2.21"

      # Optional complete fabric-device replacement. The fabric site and IP set
      # must match the batch, and every replacement remains an EDGE_NODE.
      # fabric_devices_config:
      #   - fabric_devices:
      #       fabric_name: Global/USA/San Jose/BLDG23
      #       device_config:
      #         - device_ip: "192.0.2.20"
      #           device_roles:
      #             - EDGE_NODE
      #         - device_ip: "192.0.2.21"
      #           device_roles:
      #             - EDGE_NODE

    # Old-device identifiers are needed for host migration and cleanup, not for
    # the new-device onboarding stages. Each old mapping must use exactly one
    # supported identifier.
    device_mapping:
      - old:
          hostname: old-edge-01.example.test
        new_device_management_ip: "192.0.2.20"
        # Restrict both migration components for this device to the mappings
        # listed below. Port channels with no mapped members are omitted.
        only_mapped_interfaces: true
        port_assignment_interface_mappings:
          - source_interface_name: GigabitEthernet1/0/5
            destination_interface_name: GigabitEthernet1/0/4
        port_channel_interface_mappings:
          - source_interface_name: GigabitEthernet1/0/47
            destination_interface_name: TenGigabitEthernet1/1/1
          - source_interface_name: GigabitEthernet1/0/48
            destination_interface_name: TenGigabitEthernet1/1/2

      - old:
          serial_number: OLD-SERIAL-0002
        new_device_management_ip: "192.0.2.21"
        # false is the default: mapped interfaces are renamed while unmapped
        # source interfaces retain their names for 1:1 migration.
        only_mapped_interfaces: false
        port_assignment_interface_mappings:
          - source_interface_name: GigabitEthernet2/0/6
            destination_interface_name: GigabitEthernet2/0/5
        port_channel_interface_mappings: []
